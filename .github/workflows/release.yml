name: Release

# Attaches the qbittorrent-nox source archive to the same release that ships the
# binary. This is what satisfies GPLv3 section 6(d): equivalent access to the
# Corresponding Source from the same place the object code is offered.
#
# A link to upstream does not satisfy it. The archive has to be on this release.
# See licenses/README.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach compliance assets to'
        required: true

permissions:
  contents: write

jobs:
  compliance-assets:
    name: Build the compliance bundle
    runs-on: ubuntu-latest
    outputs:
      sidecar-version: ${{ steps.pin.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned sidecar
        id: pin
        run: echo "version=$(jq -r .version sidecar.json)" >> "$GITHUB_OUTPUT"

      - name: Fetch the corresponding source
        run: scripts/fetch-sidecar-source.sh dist/licences

      - name: Bundle the licence texts that ship with the app
        run: |
          set -euo pipefail

          # rigseed's own, and the things it bundles directly.
          cp licenses/fonts/Inter-OFL.txt            dist/licences/
          cp licenses/fonts/JetBrainsMono-OFL.txt    dist/licences/
          cp licenses/lucide/ISC.txt                 dist/licences/lucide-ISC.txt
          cp LICENSE                                 dist/licences/rigseed-LICENSE-Apache-2.0.txt
          cp NOTICE                                  dist/licences/rigseed-NOTICE.txt

          # The sidecar's own dependencies, whose compiled output we
          # redistribute. Which of these ships in which installer differs by
          # platform, and the release is one page for all three, so all of them
          # are attached and THIRD-PARTY.md says which applies where.
          cp licenses/THIRD-PARTY.md                 dist/licences/
          cp licenses/qt/LGPL-3.0-only.txt           dist/licences/qt-LGPL-3.0-only.txt
          cp licenses/qt/GPL-3.0-only.txt            dist/licences/qt-GPL-3.0-only.txt
          cp licenses/icu/LICENSE.txt                dist/licences/icu-LICENSE.txt
          cp licenses/openssl/LICENSE.txt            dist/licences/openssl-LICENSE-Apache-2.0.txt
          cp licenses/boost/LICENSE_1_0.txt          dist/licences/boost-LICENSE-1.0.txt
          cp licenses/libtorrent/LICENSE.txt         dist/licences/libtorrent-LICENSE-BSD-3-Clause.txt
          cp licenses/zlib/LICENSE.txt               dist/licences/zlib-LICENSE.txt

          ls -la dist/licences

      # A missing cp above is a silent omission: the release still publishes,
      # and nobody notices the obligation was dropped until somebody asks for
      # the text. Named explicitly so the build fails instead.
      - name: Check every third-party licence text is present
        run: |
          set -euo pipefail
          missing=0
          for f in THIRD-PARTY.md                    qt-LGPL-3.0-only.txt qt-GPL-3.0-only.txt icu-LICENSE.txt                    openssl-LICENSE-Apache-2.0.txt boost-LICENSE-1.0.txt                    libtorrent-LICENSE-BSD-3-Clause.txt zlib-LICENSE.txt                    Inter-OFL.txt JetBrainsMono-OFL.txt lucide-ISC.txt                    rigseed-LICENSE-Apache-2.0.txt rigseed-NOTICE.txt; do
            if [ ! -s "dist/licences/$f" ]; then
              echo "::error::licence text missing or empty: $f"
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      - uses: actions/upload-artifact@v4
        with:
          name: compliance-bundle
          path: dist/licences/
          retention-days: 90

  # The application build. Depends on compliance-assets so a release can never
  # publish a binary without its corresponding source, which is the whole point
  # of the ordering: GPLv3 section 6(d) wants both offered from the same place.
  build-app:
    name: ${{ matrix.label }}
    needs: compliance-assets
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should still let the others produce their bundles.
      # A partial release is visible and fixable; a cancelled matrix tells you
      # nothing about the platforms that would have worked.
      fail-fast: false
      matrix:
        include:
          # All three. Every sidecar is verified on the artefact that ships
          # rather than on the copy the build made, which is the distinction
          # that hid three separate faults in this file's history.
          #
          # Linux is verified by running it: on Ubuntu 22.04, the deb's
          # qbittorrent-nox resolves all four Qt and three ICU libraries
          # through /usr/bin/../lib/rigseed/lib and prints its version with no
          # warnings. Without QT_PLUGIN_PATH the same binary still answers
          # `No TLS backend is available`, so the variable rigseed sets at
          # spawn is doing the work.
          #
          # macOS is verified structurally and not behaviourally, because
          # nobody here has a Mac. Its load commands are correct on both
          # architectures of the universal binary, and its plugins carry
          # @loader_path/../../lib. Whether it launches is unproven, and
          # Gatekeeper will refuse it unsigned regardless.
          - os: ubuntu-22.04
            label: linux-x86_64
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            label: windows-x86_64
            triple: x86_64-pc-windows-msvc
          # Apple Silicon only. The sidecar release carries no x86_64 macOS
          # build, so an Intel bundle would ship without its daemon.
          - os: macos-latest
            label: macos-aarch64
            triple: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Confirm the tag matches the version being built
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(jq -r .version package.json)
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "building $version for $tag"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 needs webkit2gtk-4.1. libxdo is for the tray, librsvg for
      # icon rendering, patchelf for relocation. xdg-utils is copied into the
      # bundle by Tauri itself and its absence stops the build outright.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential file xdg-utils

      - name: Install
        run: pnpm install --frozen-lockfile

      # Downloads the pinned qbittorrent-nox for this runner's triple along with
      # the Qt libraries it cannot start without. Both, or the script fails.
      - name: Fetch the sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Invoked through bash rather than executed. The mode bit is set in
        # git, but Windows checkouts do not carry one, so relying on it would
        # work on two runners out of three.
        run: bash scripts/fetch-sidecar-binary.sh ${{ matrix.triple }}

      # The bundler downloads WiX and NSIS on Windows, and linuxdeploy plus its
      # plugins on Linux, on every run. Caching them takes that network round
      # trip off the critical path: a release already failed once at
      # "connection forcibly closed by the remote host" after the whole Rust
      # build had succeeded.
      - name: Cache the bundler tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri
            ~/AppData/Local/tauri
          key: tauri-bundler-${{ matrix.label }}-v1

      # createUpdaterArtifacts signs at build time, so a missing key does not
      # produce unsigned archives: it fails the bundler partway through a build
      # that takes many minutes. Checked first, by name, so the failure says
      # which secret is missing rather than surfacing as a bundler error.
      - name: Confirm the updater signing key is present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. tauri.conf.json has createUpdaterArtifacts enabled, so the build cannot sign the updater archives. Add the secret, or turn createUpdaterArtifacts off."
            exit 1
          fi
          # Warned rather than failed, because a key generated without a
          # password legitimately needs no secret here. For a key that does
          # have one, the bundler fails later with "Wrong password for that
          # key", and this line sitting above it in the log is the difference
          # between that being obvious and being a mystery.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty. That is correct only if the signing key was generated without a password. If it has one, the bundler will fail with 'Wrong password for that key'."
          fi
          echo "signing key present"

      - name: Build the bundles
        run: pnpm run app:build
        env:
          # Read by the bundler to sign the updater archives. Only the public
          # half of this keypair is committed, in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Unsigned on every platform for this release, which is a deliberate
      # choice recorded in the release notes rather than an oversight. Checksums
      # matter more because of it: they are the only way a user can tell the
      # download is the one this workflow produced.
      - name: Collect the bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bundles
          find src-tauri/target/release/bundle \
            \( -name '*-setup.exe' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -type f -exec cp {} dist/bundles/ \;

          # No MSI, deliberately. latest.json can name exactly one artifact per
          # platform key, so shipping both Windows installers meant whichever
          # the manifest named was wrong for everybody who had chosen the
          # other: an NSIS package installed over an MSI registration does not
          # upgrade it, it registers alongside it. Found by looking at a real
          # MSI install while rehearsing 0.1.4 to 0.1.5.
          #
          # Set in tauri.windows.conf.json, which replaces the main config's
          # targets array wholesale rather than extending it, the same way
          # tauri.linux.conf.json already pins its three Linux formats.
          #
          # Guarded rather than trusted, because that array is one edit away
          # from letting the MSI back in and the breakage is silent for
          # whoever installed the format we stopped offering.
          if find src-tauri/target/release/bundle -type f -name '*.msi' | grep -q .; then
            echo "::error::an .msi was produced. Windows ships NSIS only, because the manifest can offer one artifact per platform and MSI and NSIS installs do not upgrade each other. Windows targets are set in src-tauri/tauri.windows.conf.json, which replaces the main config's array wholesale."
            exit 1
          fi

          # The updater's payloads, found by their signatures rather than by
          # guessing filenames.
          #
          # The first attempt globbed for *.tar.gz and *.nsis.zip on the belief
          # that every platform produces a separate archive. Two of three do
          # not. Tauri 2.12 signs the installers in place on Windows and the
          # packages in place on Linux; only macOS gets an archive of its own:
          #
          #   windows  the x64-setup.exe, with a .sig (NSIS only, see above)
          #   linux    the .deb, .rpm and .AppImage, each with a .sig
          #   macos    rigseed.app.tar.gz with a .sig
          #
          # Worse than failing, that glob quietly matched control.tar.gz and
          # data.tar.gz out of the deb's own build directory, so Linux uploaded
          # the innards of a Debian package and the job went green.
          #
          # A .sig comes from exactly one place, the signer, so anything
          # carrying one is a payload and anything without one is not.
          mkdir -p dist/updater
          find src-tauri/target/release/bundle -type f -name '*.sig' > updater-sigs.txt
          while IFS= read -r sig; do
            [ -n "$sig" ] || continue
            payload="${sig%.sig}"
            [ -f "$payload" ] || continue
            cp "$sig" dist/updater/
            # The payload is copied only when it is not already going up as an
            # installer. On Windows and Linux the signed file IS the installer,
            # already in dist/bundles, and sending a 120MB AppImage twice would
            # double the upload to say the same thing.
            if [ ! -f "dist/bundles/$(basename "$payload")" ]; then
              cp "$payload" dist/updater/
            fi
          done < updater-sigs.txt
          rm -f updater-sigs.txt

          echo "updater artifacts for ${{ matrix.label }}:"
          ls -la dist/updater
          if [ -z "$(ls -A dist/updater)" ]; then
            echo "::error::nothing was signed for ${{ matrix.label }}. createUpdaterArtifacts is on, so the bundler should have produced a .sig beside at least one artifact."
            exit 1
          fi
          if [ -z "$(ls -A dist/bundles)" ]; then
            echo "::error::no bundles produced for ${{ matrix.label }}"
            exit 1
          fi
          # Proves the version actually resolved. tauri.conf.json points its
          # version at package.json rather than repeating the number, and a path
          # that failed to resolve would fall back to the Cargo.toml version
          # silently. Tauri puts the version in every bundle's filename, so the
          # filename is where that failure becomes visible.
          version=$(jq -r .version package.json)
          if ! ls dist/bundles | grep -q "$version"; then
            echo "::error::no bundle filename carries version $version:"
            ls dist/bundles
            exit 1
          fi
          cd dist/bundles
          for f in *; do
            { sha256sum "$f" 2>/dev/null || shasum -a 256 "$f"; } > "$f.sha256"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.label }}
          path: dist/bundles/
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.label }}
          path: dist/updater/
          retention-days: 90
          if-no-files-found: error

  publish:
    name: Attach assets to the release
    # Both, so the release page can never carry a binary without the source that
    # licenses it, and never carry source for a build that failed.
    needs: [compliance-assets, build-app]
    runs-on: ubuntu-latest
    steps:
      # Only for the changelog below. The job otherwise works entirely from
      # the artifacts the build jobs uploaded, and fetch-depth 0 because a
      # shallow clone has no previous tag to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: compliance-bundle
          path: dist/licences

      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist/bundles
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          merge-multiple: true
          path: dist/updater

      # The file every installed copy polls. Tauri reads it, compares the
      # version against its own, and verifies the archive it names against the
      # signature here using the public key compiled into the app.
      #
      # Assembled rather than hand-written, because a signature pasted by hand
      # that does not match its archive fails on the user's machine and nowhere
      # else: the build is green, the release looks complete, and every update
      # silently refuses to apply.
      - name: Assemble the updater manifest
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/$REPO/releases/download/$TAG"

          # The release body, when a human has already written it. A draft that
          # has only the workflow's placeholder contributes nothing, so the app
          # links out instead of printing "Draft. Assets attached by the
          # release workflow." as though it were a changelog.
          notes="See https://github.com/$REPO/releases/tag/$TAG for what changed."
          body=$(gh release view "$TAG" --repo "$REPO" --json body -q .body 2>/dev/null || true)
          case "$body" in
            ''|'Draft. Assets attached by the release workflow.') ;;
            *UNREVIEWED*) ;;
            *) notes="$body" ;;
          esac

          platforms='{}'
          add() {
            # $1 = Tauri platform key, $2 = filename glob
            local key="$1" glob="$2" file sig
            # Both directories: the signature is always in dist/updater, but
            # the thing it signs is in dist/bundles whenever that thing is the
            # installer itself, which on Windows and Linux it is.
            file=$(find dist/updater dist/bundles -type f -name "$glob" ! -name '*.sig' ! -name '*.sha256' | head -1)
            if [ -z "$file" ]; then
              echo "::warning::no updater archive for $key (looked for $glob)"
              return
            fi
            sig="dist/updater/$(basename "$file").sig"
            if [ ! -s "$sig" ]; then
              echo "::error::$file has no signature beside it. The bundler signs these, so an archive without one means the signing key was wrong or absent."
              exit 1
            fi
            platforms=$(jq -n --argjson p "$platforms" --arg k "$key" \
              --arg sig "$(cat "$sig")" --arg url "$base/$(basename "$file")" \
              '$p + {($k): {signature: $sig, url: $url}}')
            echo "  $key -> $(basename "$file")"
          }

          # One artifact per platform key, chosen rather than whatever matched
          # first. Windows is given the NSIS installer and not the MSI: both are
          # signed, both would work, and offering two for one platform key is
          # not a thing the manifest can express. Linux is given the AppImage
          # because it is the only Linux format the updater can apply; a deb or
          # rpm is owned by the package manager and must not be rewritten
          # underneath it, which is why those are signed but never offered here.
          echo "platforms in this manifest:"
          add "windows-x86_64" '*-setup.exe'
          add "darwin-aarch64" '*.app.tar.gz'
          add "linux-x86_64"   '*.AppImage'

          if [ "$(jq 'length' <<<"$platforms")" -eq 0 ]; then
            echo "::error::no updater archives at all, refusing to publish a manifest that offers nothing"
            exit 1
          fi

          jq -n --arg v "$version" --arg n "$notes" \
                --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
                '{version: $v, notes: $n, pub_date: $d, platforms: $p}' \
            > dist/updater/latest.json

          cat dist/updater/latest.json

      - name: Confirm the source archive is present before publishing
        run: |
          set -euo pipefail
          archive=$(find dist/licences -name 'qbittorrent-nox-*-source.tar.gz' | head -1)
          if [ -z "$archive" ]; then
            echo "::error::no sidecar source archive in the bundle, refusing to publish"
            exit 1
          fi
          size=$(wc -c <"$archive")
          if [ "$size" -lt 1000000 ]; then
            echo "::error::source archive is only $size bytes, refusing to publish"
            exit 1
          fi
          echo "source archive present: $archive ($size bytes)"

      - name: Confirm there is something to install
        run: |
          set -euo pipefail
          installers=$(find dist/bundles -type f ! -name '*.sha256' | wc -l)
          if [ "$installers" -eq 0 ]; then
            echo "::error::no installers in the bundle set, refusing to publish"
            exit 1
          fi
          echo "$installers installers:"
          find dist/bundles -type f ! -name '*.sha256' -printf '  %f (%s bytes)\n'

      # Created as a draft when it does not already exist. Pushing a tag should
      # not put a download in front of anyone before someone has looked at it,
      # and an unsigned build in particular is worth looking at first.
      - name: Make sure the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving its notes alone"
          else
            # A starting changelog rather than a placeholder. v0.1.4 shipped
            # with "Draft. Assets attached by the release workflow." as its
            # body while latest.json told every user to read that page for
            # what changed, so the one page the update prompt pointed at said
            # nothing. Writing notes by hand is the step that gets skipped, so
            # the draft now arrives with the commits already sorted and a
            # human prunes rather than composes.
            version="${TAG#v}"
            prev=$(git tag --sort=-v:refname | grep -vxF "$TAG" | head -1)
            if [ -n "$prev" ]; then range="$prev..$TAG"; else range="$TAG"; fi
            echo "describing $range"

            sec() {
              local title="$1" pattern="$2" lines
              lines=$(git log --no-merges --pretty='%s' "$range" | grep -E "$pattern" || true)
              [ -n "$lines" ] || return 0
              echo "### $title"
              echo "$lines" | sed -E 's/^[a-z]+(\([^)]*\))?: //; s/^/- /'
              echo
            }

            {
              # Deleting this line is what marks the notes as reviewed. The
              # manifest step reads it: while it is here the update prompt
              # links to the release page rather than quoting a raw commit
              # list into a dialog box.
              echo '<!-- UNREVIEWED: edit these notes, then delete this line -->'
              echo
              echo "## Changes"
              echo
              sec "Added" '^feat(\([^)]*\))?: '
              sec "Fixed" '^fix(\([^)]*\))?: '
              sec "Documentation" '^docs(\([^)]*\))?: '
              sec "Internal" '^(chore|refactor|test|ci|build|perf)(\([^)]*\))?: '
              echo "## Which file do I want"
              echo
              echo "| Platform | File |"
              echo "|---|---|"
              echo "| Windows | \`rigseed_${version}_x64-setup.exe\` |"
              echo "| macOS (Apple silicon) | \`rigseed_${version}_aarch64.dmg\` |"
              echo "| Linux, any distribution | \`rigseed_${version}_amd64.AppImage\` |"
              echo "| Debian or Ubuntu | \`rigseed_${version}_amd64.deb\` |"
              echo "| Fedora or RHEL | \`rigseed-${version}-1.x86_64.rpm\` |"
              echo
              echo "A \`.sha256\` sits beside each one if you want to check your download."
              echo "The \`.sig\` files and \`rigseed.app.tar.gz\` are what the in-app updater"
              echo "consumes; you do not need to download them by hand."
            } > release-notes.md

            gh release create "$TAG" --repo "${{ github.repository }}" \
              --draft --title "$TAG" --notes-file release-notes.md
            rm -f release-notes.md
            echo "created $TAG as a draft with a starting changelog"
          fi

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # dist/updater carries latest.json, the per-platform archives it
          # names, and a .sig for each. The manifest URLs point at this
          # release, so the archives have to be attached here or every update
          # resolves to a 404 the app can only report as a failed download.
          gh release upload "$TAG" dist/licences/* dist/bundles/* dist/updater/* \
            --repo "${{ github.repository }}" --clobber
          echo "attached the installers, the compliance bundle and the updater manifest to $TAG"

      # Tell the site to rebuild, so its changelog is not a version behind.
      #
      # The changelog page fetches these releases at build time, and the site
      # builds on its own pushes, so without this a release ships and the page
      # describing it appears whenever somebody next touches that repository.
      #
      # GITHUB_TOKEN cannot do this: it is scoped to this repository alone, and
      # a dispatch to another one needs a token that can see it. Absent, this
      # step says so and does not fail the release: a stale changelog is worth
      # a notice, not a red release.
      - name: Ask the site to rebuild its changelog
        shell: bash
        env:
          SITE_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_TOKEN:-}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set, so the site was not asked to rebuild. Its changelog will update on the next push there, or run the site's deploy workflow by hand."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/verastack-labs/rigseed/dispatches \
            -d '{"event_type":"app-released"}')
          if [ "$code" != "204" ]; then
            echo "::warning::the site rebuild request returned $code rather than 204. The release is fine; the changelog page may be a version behind until that site builds again."
          else
            echo "asked verastack-labs/rigseed to rebuild"
          fi
