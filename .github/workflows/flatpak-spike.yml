# Answers one question and then should be deleted.
#
# Can the Qt 6 and ICU 73 shared objects in rigseed's .deb, built on Ubuntu
# 22.04, load inside a Flatpak runtime? Everything here exists to get that
# answer on a real Linux machine, because the development machine is Windows
# and WSL cannot install flatpak without an interactive password.
#
# It runs on a push to a spike/ branch rather than only on workflow_dispatch,
# because a dispatch-only workflow is not offered by GitHub until the file is
# on the default branch, and the whole point is to learn this before merging
# anything.
name: Flatpak spike

on:
  push:
    branches: ['spike/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  can-the-bundled-qt-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flatpak and the GNOME runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive \
            flathub org.gnome.Platform//47 org.gnome.Sdk//47

      # v0.1.7 shipped before the metainfo existed, so the manifest installs
      # the repository's copy and needs it beside the manifest to do that.
      # v0.1.7 shipped before both of these existed in the package, so the
      # manifest installs the repository copies and needs them beside it.
      - name: Put the metainfo and the 64x64 icon where the manifest expects them
        run: |
          cp src-tauri/linux/dev.verastack.rigseed.metainfo.xml flatpak/
          cp src-tauri/icons/64x64.png flatpak/

      - name: Build and install the Flatpak
        run: |
          set -euo pipefail
          flatpak-builder --user --install --force-clean \
            build-dir flatpak/spike-prebuilt-deb.yml

      # The actual experiment. Run under `sh` rather than launching rigseed,
      # because there is no display and the question is only about the daemon
      # and its libraries.
      - name: Does the bundled qbittorrent-nox resolve its libraries
        run: |
          set -uo pipefail

          echo "::group::ldd, looking for anything unresolved"
          flatpak run --command=sh dev.verastack.rigseed \
            -c 'ldd /app/bin/qbittorrent-nox' | tee ldd.txt || true
          echo "::endgroup::"

          if grep -q 'not found' ldd.txt; then
            echo "::error::the bundled libraries do not resolve inside the runtime"
            grep 'not found' ldd.txt
            echo "VERDICT=prebuilt-deb-will-not-work" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "every shared object resolved"

      - name: Does it actually run
        run: |
          set -uo pipefail

          # rigseed sets QT_PLUGIN_PATH when it spawns the daemon, so the
          # spike sets the same thing rather than testing a configuration
          # that never happens in the app.
          echo "::group::with QT_PLUGIN_PATH, as rigseed spawns it"
          out=$(flatpak run --command=sh dev.verastack.rigseed -c \
            'QT_PLUGIN_PATH=/app/lib/rigseed qbittorrent-nox --version 2>&1') || true
          echo "$out"
          echo "::endgroup::"

          case "$out" in
            *qBittorrent*)
              echo "VERDICT: the daemon runs inside the runtime"
              ;;
            *)
              echo "::error::qbittorrent-nox did not report a version. Output above."
              exit 1
              ;;
          esac

          # The control. On Ubuntu this same binary answers "No TLS backend is
          # available" without the variable, which is how we know the variable
          # is doing the work rather than being cargo cult. If it passes here
          # too, the runtime is supplying something Ubuntu did not.
          echo "::group::control, without QT_PLUGIN_PATH"
          flatpak run --command=sh dev.verastack.rigseed \
            -c 'qbittorrent-nox --version 2>&1' || true
          echo "::endgroup::"

      - name: What a software centre makes of the metadata
        run: |
          set -uo pipefail
          sudo apt-get install -y -qq appstream desktop-file-utils
          flatpak run --command=sh dev.verastack.rigseed \
            -c 'cat /app/share/applications/dev.verastack.rigseed.desktop'
          flatpak run --command=sh dev.verastack.rigseed \
            -c 'cat /app/share/metainfo/dev.verastack.rigseed.metainfo.xml' > installed.metainfo.xml
          appstreamcli validate --no-net installed.metainfo.xml || true

  # The architectural question, answered by looking instead of reasoning.
  #
  # rigseed is two programs with opposite needs. Tauri needs webkit2gtk-4.1,
  # which the GNOME runtime carries. qbittorrent-nox needs Qt 6, which the KDE
  # runtime carries. If one runtime has both, the Flathub manifest is
  # straightforward. If neither does, one of them has to be built from source,
  # and which one matters enormously: a non-GUI Qt 6 is a long build, and
  # WebKitGTK is one of the longest builds there is.
  what-do-the-runtimes-actually-have:
    runs-on: ubuntu-latest
    steps:
      - name: Install both runtimes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak
          flatpak remote-add --if-not-exists --user             flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub             org.gnome.Platform//47 org.kde.Platform//6.10

      - name: What each one carries
        run: |
          set -uo pipefail
          for rt in org.gnome.Platform//47 org.kde.Platform//6.10; do
            echo "::group::$rt"
            for lib in libwebkit2gtk-4.1 libwebkit2gtk-4.0 libQt6Core libQt6Network libQt6Sql libQt6Xml; do
              found=$(flatpak run --command=sh "$rt" -c                 "ls /usr/lib/$(uname -m)-linux-gnu/${lib}.so* 2>/dev/null | head -1" 2>/dev/null)
              if [ -n "$found" ]; then
                echo "  HAVE  $lib  ->  $found"
              else
                echo "  none  $lib"
              fi
            done
            echo "::endgroup::"
          done

  # The only part of a Flathub manifest that can genuinely fail.
  #
  # The runtime probe settled that GNOME has webkit2gtk and no Qt, and KDE has
  # Qt and no webkit2gtk. Tauri cannot give up webkit2gtk and WebKitGTK is far
  # too large to build, so the runtime is GNOME and Qt has to come from source.
  #
  # qbittorrent-nox needs Core, Network, Sql, Xml and Concurrent, every one of
  # them in qtbase, so this builds qtbase alone with the GUI switched off. The
  # question is whether that produces the four libraries AND the two plugins
  # rigseed currently ships by hand: the TLS backend and the SQL driver. The
  # TLS one is the one to watch, because its absence is exactly the
  # "No TLS backend is available" failure the bundled build already taught us
  # to look for, and it is silent until a tracker is contacted.
  #
  # The checksum is computed here rather than written by hand, so nothing in
  # this repository ever carries a hash somebody guessed.
  can-qtbase-build-without-the-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Flatpak, the GNOME runtime and its SDK
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Fetch qtbase and take its checksum
        id: qt
        run: |
          set -euo pipefail
          url=https://download.qt.io/archive/qt/6.8/6.8.4/submodules/qtbase-everywhere-opensource-src-6.8.4.tar.xz
          curl -sSL --retry 5 --retry-all-errors -o qtbase.tar.xz "$url"
          sum=$(sha256sum qtbase.tar.xz | cut -d' ' -f1)
          echo "size: $(stat -c%s qtbase.tar.xz) bytes"
          echo "sha256: $sum"
          echo "sum=$sum" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build it
        run: |
          set -euo pipefail
          cat > qtbase-probe.yml <<MANIFEST
          app-id: dev.verastack.qtbaseprobe
          runtime: org.gnome.Platform
          runtime-version: '47'
          sdk: org.gnome.Sdk
          command: true
          modules:
            - name: qtbase
              buildsystem: cmake-ninja
              config-opts:
                - -DCMAKE_BUILD_TYPE=Release
                - -DQT_BUILD_EXAMPLES=OFF
                - -DQT_BUILD_TESTS=OFF
                # The whole point: no GUI stack. Widgets depends on gui and
                # switches itself off with it.
                - -DFEATURE_gui=OFF
                # What qbittorrent-nox actually uses.
                - -DFEATURE_network=ON
                - -DFEATURE_sql=ON
                - -DFEATURE_sql_sqlite=ON
                - -DFEATURE_xml=ON
                - -DFEATURE_concurrent=ON
                # Loaded at runtime rather than linked, which is how the
                # bundled build does it and what makes the TLS plugin a
                # plugin rather than a hard dependency.
                - -DFEATURE_openssl_linked=OFF
              sources:
                - type: archive
                  url: ${{ steps.qt.outputs.url }}
                  sha256: ${{ steps.qt.outputs.sum }}
          MANIFEST
          echo "::group::manifest"
          cat qtbase-probe.yml
          echo "::endgroup::"
          flatpak-builder --user --install --force-clean build-qt qtbase-probe.yml

      - name: Did it produce what qbittorrent-nox needs
        run: |
          set -uo pipefail
          missing=0
          echo "::group::libraries"
          for lib in libQt6Core libQt6Network libQt6Sql libQt6Xml libQt6Concurrent; do
            found=$(flatpak run --command=sh dev.verastack.qtbaseprobe \
              -c "ls /app/lib/*/${lib}.so* /app/lib/${lib}.so* 2>/dev/null | head -1")
            if [ -n "$found" ]; then echo "  HAVE  $lib -> $found"
            else echo "  MISSING  $lib"; missing=1; fi
          done
          echo "::endgroup::"

          echo "::group::plugins, the ones rigseed ships by hand today"
          flatpak run --command=sh dev.verastack.qtbaseprobe \
            -c 'find /app -path "*plugins*" \( -name "*tls*" -o -name "*sqldrivers*" -o -name "*networkinformation*" \) -maxdepth 6 | sort'
          echo "::endgroup::"

          tls=$(flatpak run --command=sh dev.verastack.qtbaseprobe \
            -c 'find /app -path "*tls*" -name "*openssl*.so" | head -1')
          if [ -z "$tls" ]; then
            echo "::error::no OpenSSL TLS plugin was built. That is the silent failure: the daemon starts, reports its version, and answers every HTTPS tracker with 'No TLS backend is available'."
            missing=1
          else
            echo "TLS backend built: $tls"
          fi

          [ "$missing" -eq 0 ] || exit 1
          echo "qtbase without the GUI gives qbittorrent-nox everything it needs"

  # The whole daemon side, built from source, end to end.
  #
  # qtbase is already proven. This adds the four modules that turn it into a
  # working qbittorrent-nox and answers the two questions left on this side:
  # whether qttools builds its Linguist tools against a GUI-less qtbase, and
  # whether the result runs.
  #
  # The run is the interesting part. In the prebuilt-.deb spike the daemon
  # needed QT_PLUGIN_PATH pointing at a relocated plugin directory, and
  # without it answered "No TLS backend is available". Here Qt is installed
  # at its own prefix, so it should find /app/plugins unaided. This asserts
  # the absence of that warning rather than just a zero exit, because a
  # missing TLS backend does not fail --version, it fails the first tracker.
  can-the-whole-daemon-build-from-source:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Flatpak, the GNOME runtime and its SDK
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//47 org.gnome.Sdk//47

      # Every source is hashed here and substituted over a placeholder, so no
      # checksum in this repository was ever written by hand. The summary is
      # what gets copied into the real Flathub manifest, which has to carry
      # literal values.
      #
      # Retried hard: download.qt.io already failed one run at under 10KB/s,
      # and a slow mirror is not a result worth reporting.
      - name: Hash every source and substitute them in
        run: |
          set -euo pipefail
          m=flatpak/daemon-stack-probe.yml

          hash_into() {
            token="$1"
            url="$2"
            out=$(mktemp)
            curl -sSL --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 -o "$out" "$url"
            sum=$(sha256sum "$out" | cut -d' ' -f1)
            echo "  $token = $sum  ($(stat -c%s "$out") bytes)"
            sed -i "s|$token|$sum|" "$m"
            rm -f "$out"
          }

          echo "::group::checksums, computed not copied"
          hash_into SHA256_QTBASE https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtbase-everywhere-opensource-src-6.8.3.tar.xz
          hash_into SHA256_QTTOOLS https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qttools-everywhere-opensource-src-6.8.3.tar.xz
          hash_into SHA256_BOOST https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.gz
          hash_into SHA256_LIBTORRENT https://github.com/arvidn/libtorrent/releases/download/v2.0.11/libtorrent-rasterbar-2.0.11.tar.gz
          hash_into SHA256_QBITTORRENT https://github.com/qbittorrent/qBittorrent/archive/refs/tags/release-5.2.3.tar.gz
          echo "::endgroup::"

          if grep -n 'SHA256_' "$m"; then
            echo "::error::a placeholder was not substituted"
            exit 1
          fi
          echo "all five substituted"

      - name: Build the stack
        run: |
          set -euo pipefail
          flatpak-builder --user --install --force-clean \
            build-daemon flatpak/daemon-stack-probe.yml

      - name: Does it run, and is the TLS backend found unaided
        run: |
          set -uo pipefail

          echo "::group::qbittorrent-nox --version, no QT_PLUGIN_PATH set"
          out=$(flatpak run --command=sh dev.verastack.daemonstackprobe \
            -c 'qbittorrent-nox --version 2>&1')
          echo "$out"
          echo "::endgroup::"

          case "$out" in
            *"qBittorrent v5.2.3"*)
              echo "the daemon runs, and it is the version sidecar.json pins"
              ;;
            *qBittorrent*)
              echo "::error::the daemon runs but reports the wrong version. sidecar.json pins 5.2.3 and every other rigseed platform ships it."
              exit 1
              ;;
            *) echo "::error::no version reported"; exit 1 ;;
          esac

          # The assertion that matters. This exact string is what the
          # relocated bundle produces when its plugins cannot be found, so
          # its absence here is the evidence that building against the
          # runtime removes the QT_PLUGIN_PATH dance entirely.
          case "$out" in
            *"TLS backend"*|*"TLS initialization"*)
              echo "::error::Qt could not find its TLS backend without help. The plugin directory is not being discovered from the install prefix."
              exit 1
              ;;
          esac
          echo "no TLS warning: Qt found /app/plugins on its own"

          echo "::group::what got installed"
          flatpak run --command=sh dev.verastack.daemonstackprobe \
            -c 'ls /app/bin; echo ---; ls /app/plugins; echo ---; ls /app/lib/libQt6*.so* 2>/dev/null | head'
          echo "::endgroup::"

  # The last unknown: can rigseed's own dependencies be vendored at all.
  #
  # Flatpak builds with no network, so every crate and every npm package has
  # to be declared as a source with a checksum before the build starts. Two
  # generators do that, and neither has ever been pointed at this repository.
  #
  # The cargo side should be the easy case: Cargo.lock has no git
  # dependencies at all, so all 625 crates come from crates.io with checksums
  # already in the lockfile.
  #
  # The node side is the one with a known sharp edge. This project's
  # pnpm-lock.yaml is lockfileVersion 9.0 and the generator defaults to store
  # version 10, so it is told 9 explicitly. Getting that wrong does not fail
  # here, it fails later as an offline install that cannot find packages.
  can-rigseed-dependencies-be-vendored:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: The generators
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet aiohttp tomlkit
          python3 -m pip install --quiet \
            "git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node"
          curl -sSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          echo "flatpak-node-generator: $(command -v flatpak-node-generator || echo MISSING)"

      - name: Vendor the crates
        run: |
          set -euo pipefail
          python3 flatpak-cargo-generator.py -o cargo-sources.json src-tauri/Cargo.lock
          echo "entries: $(python3 -c 'import json;print(len(json.load(open("cargo-sources.json"))))')"
          echo "size: $(stat -c%s cargo-sources.json) bytes"

      - name: Vendor the npm packages
        run: |
          set -euo pipefail
          flatpak-node-generator --help | grep -q pnpm-store-version \
            || echo "::warning::this build of the generator has no --pnpm-store-version; the flag may have moved"
          flatpak-node-generator pnpm pnpm-lock.yaml \
            --pnpm-store-version 9 -o node-sources.json
          echo "entries: $(python3 -c 'import json;print(len(json.load(open("node-sources.json"))))')"
          echo "size: $(stat -c%s node-sources.json) bytes"

      - name: Are they actually usable as flatpak sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          for name in ("cargo-sources.json", "node-sources.json"):
              data = json.load(open(name))
              assert isinstance(data, list) and data, f"{name} is not a non-empty list"
              kinds = {}
              unchecked = 0
              for entry in data:
                  kind = entry.get("type", "?")
                  kinds[kind] = kinds.get(kind, 0) + 1
                  # A source flatpak-builder will fetch over the network has
                  # to carry a checksum, or the build is not reproducible and
                  # Flathub will not take it.
                  if kind in ("file", "archive") and not any(
                      k in entry for k in ("sha256", "sha512", "md5")
                  ):
                      unchecked += 1
              print(f"{name}: {len(data)} entries, kinds={kinds}, unchecked={unchecked}")
              assert unchecked == 0, f"{name} has {unchecked} remote sources with no checksum"
          print("both generators produced checksummed, declarable sources")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: vendored-sources
          path: |
            cargo-sources.json
            node-sources.json
          retention-days: 14
