name: Build sidecar

# Builds qbittorrent-nox for every platform we ship, once per qBittorrent
# version, and publishes the binaries to a release keyed by that version.
#
# This does NOT run on ordinary commits or pull requests. It runs when the pin
# in sidecar.json changes, or when dispatched by hand. Everything downstream
# downloads the published binary, so a normal CI run stays a few seconds rather
# than half an hour.
#
# The recipe is a port of qBittorrent's own ci_ubuntu / ci_macos / ci_windows
# workflows at the pinned tag, narrowed to the headless target. That is
# deliberate: the first attempt used each platform's package manager for
# libtorrent and boost, and every platform drifted outside the version window
# qBittorrent supports. Homebrew shipped libtorrent 2.1, which fails against
# 5.2.3 with "no member named 'mapped_files'". Upstream builds libtorrent and
# boost from pinned source precisely to avoid that, so we do too. See
# the sidecar reference for the full account.
#
# See src-tauri/binaries/README.md and licenses/README.md. Shipping this binary
# obliges us to ship its corresponding source on the same release.

on:
  push:
    branches: [main]
    paths:
      # Only the pin. Deliberately not this file: including it meant that
      # editing the workflow, or merely adding it, kicked off a full
      # three-platform build. The version is the thing that should trigger a
      # rebuild, not the recipe. Use workflow_dispatch to test a recipe change.
      - 'sidecar.json'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if a release for this version already exists'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pin:
    name: Read the pinned version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      release: ${{ steps.read.outputs.release }}
      qt: ${{ steps.read.outputs.qt }}
      libtorrent: ${{ steps.read.outputs.libtorrent }}
      boost: ${{ steps.read.outputs.boost }}
      boost_underscored: ${{ steps.read.outputs.boost_underscored }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read sidecar.json
        id: read
        run: |
          set -euo pipefail
          version=$(jq -r .version sidecar.json)
          boost=$(jq -r .build.boost sidecar.json)
          {
            echo "version=$version"
            echo "tag=$(jq -r .tag sidecar.json)"
            echo "release=sidecar-$version"
            echo "qt=$(jq -r .build.qt sidecar.json)"
            echo "libtorrent=$(jq -r .build.libtorrent sidecar.json)"
            echo "boost=$boost"
            echo "boost_underscored=${boost//./_}"
          } >> "$GITHUB_OUTPUT"
          echo "Building qbittorrent-nox $version"

      - name: Has this version already been built?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.read.outputs.release }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.read.outputs.release }} already exists. Dispatch with force to rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.label }}
    needs: pin
    if: needs.pin.outputs.exists == 'false' || inputs.force
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            binary: qbittorrent-nox
            qt_arch: ''
            # Qt's Linux binaries link against ICU and aqtinstall ships it as a
            # separate archive. Without it lupdate dies on a missing
            # libicui18n.so at the first translation target. The archive only
            # exists for the Linux build, so it cannot go in the shared list.
            qt_archives: icu qtbase qtdeclarative qttools
          - os: windows-latest
            label: windows-x86_64
            triple: x86_64-pc-windows-msvc
            binary: qbittorrent-nox.exe
            # Named explicitly because install-qt-action still defaults to the
            # msvc2019 build, and Qt stopped publishing that from 6.8.
            qt_arch: win64_msvc2022_64
            qt_archives: qtbase qtdeclarative qttools
          - os: macos-latest
            label: macos-aarch64
            triple: aarch64-apple-darwin
            binary: qbittorrent-nox
            # The default clang_64 build is universal, so it covers arm64.
            qt_arch: ''
            qt_archives: qtbase qtdeclarative qttools

    env:
      # Kept beside the workspace rather than inside it, so the `find` over the
      # build tree in a later step cannot pick up a dependency's artefacts.
      BOOST_PATH: ${{ github.workspace }}/../boost
      LIBTORRENT_PATH: ${{ github.workspace }}/../libtorrent
      VCPKG_TRIPLET: x64-windows-static-md-release

    steps:
      - uses: actions/checkout@v4

      - name: Check out qBittorrent at the pinned tag
        uses: actions/checkout@v4
        with:
          repository: qbittorrent/qBittorrent
          ref: ${{ needs.pin.outputs.tag }}
          path: qbittorrent

      # ---------------------------------------------------------------- tools

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          if ((Get-Command "ninja.exe" -ErrorAction SilentlyContinue) -eq $null) { choco install ninja }
          ninja --version

      # Nothing is installed unless it is actually missing, and apt-get update
      # is a last resort rather than the first line.
      #
      # An unconditional update sat here for twelve minutes producing no output
      # at all: the Azure mirror answered Ign for every index, apt fell back to
      # archive.ubuntu.com, and the fetch then stalled with no timeout to end
      # it. The acquire timeouts below exist so that a repeat is a failure
      # rather than a hang.
      #
      # build-essential, cmake, libssl-dev and zlib1g-dev ship on the image, so
      # in practice this step installs ninja and nothing else.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o DPkg::Lock::Timeout=300
          )

          missing=()
          # patchelf rewrites the sidecar's RPATH so it finds the Qt
          # libraries shipped beside it rather than the build machine's.
          for pkg in build-essential cmake ninja-build libssl-dev zlib1g-dev patchelf; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo "Every build tool is already on the image."
            exit 0
          fi

          echo "Installing: ${missing[*]}"
          if ! sudo apt-get install -y --no-install-recommends "${APT_OPTS[@]}" "${missing[@]}"; then
            echo "::warning::Install failed against the image's package lists, refreshing them"
            sudo apt-get update "${APT_OPTS[@]}"
            sudo apt-get install -y --no-install-recommends "${APT_OPTS[@]}" "${missing[@]}"
          fi

      # cmake and ninja are preinstalled on the image. Notably absent:
      # libtorrent-rasterbar. Homebrew's is 2.1.x and qBittorrent 5.2.3
      # supports 2.0.10 - 2.0.x, so it is built from source below.
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install openssl@3 zlib

      # Recompiling the same pinned version after a late-stage failure is the
      # common case while this recipe is being tuned, and ccache turns that
      # from half an hour into a couple of minutes.
      - name: Set up ccache
        if: runner.os != 'Windows'
        uses: Chocobo1/setup-ccache-action@v1
        with:
          update_packager_index: false
          ccache_options: |
            max_size=1G

      - name: Set up the vcpkg binary cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # vcpkg supplies only what libtorrent and qBittorrent link against, plus
      # b2 to stage boost's headers. Not libtorrent, and not boost's compiled
      # libraries: asking vcpkg for those is what made the first attempt run
      # for over half an hour on this step. The overlay triplet exists to set
      # VCPKG_BUILD_TYPE=release, without which every package is built twice.
      - name: Install dependencies with vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          $overlay = "$env:VCPKG_INSTALLATION_ROOT/triplets_overlay"
          New-Item -Force -ItemType Directory -Path $overlay | Out-Null
          # OpenSSL is not compatible with /guard:cf, so control flow guard is
          # left off here. Upstream does the same.
          Set-Content -Path "$overlay/$env:VCPKG_TRIPLET.cmake" -Value @(
            "set(VCPKG_TARGET_ARCHITECTURE x64)",
            "set(VCPKG_LIBRARY_LINKAGE static)",
            "set(VCPKG_CRT_LINKAGE dynamic)",
            "set(VCPKG_BUILD_TYPE release)")
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install `
            --binarysource="clear;x-gha,readwrite" `
            --clean-after-build `
            --overlay-triplets="$overlay" `
            "boost-build:$env:VCPKG_TRIPLET" `
            "openssl:$env:VCPKG_TRIPLET" `
            "zlib:$env:VCPKG_TRIPLET"

      # ---------------------------------------------------------------- boost

      # Headers only. libtorrent's use of boost is header-only at this version,
      # so `--with-headers` is all that is needed and it costs a couple of
      # minutes rather than the twenty a full boost build takes. The staged
      # tree carries the BoostConfig.cmake that qBittorrent's
      # CMAKE_FIND_PACKAGE_PREFER_CONFIG lookup wants.
      - name: Fetch boost
        shell: bash
        run: |
          set -euo pipefail
          name="boost_${{ needs.pin.outputs.boost_underscored }}"
          primary="https://archives.boost.io/release/${{ needs.pin.outputs.boost }}/source/$name.tar.gz"
          mirror="https://sourceforge.net/projects/boost/files/boost/${{ needs.pin.outputs.boost }}/$name.tar.gz"

          # Every path here is relative on purpose. GNU tar reads an argument
          # containing a colon as host:path, so handing it a Windows path like
          # D:\a\_temp\boost.tar.gz sends it off trying to open an rsync
          # connection to a host named D, which is what "Cannot connect to D:
          # resolve failed" means. Relative names carry no drive letter.
          cd ..

          if ! curl -fLo boost.tar.gz "$primary"; then
            echo "::warning::archives.boost.io failed, falling back to the SourceForge mirror"
            curl -fLo boost.tar.gz "$mirror"
          fi
          tar -xf boost.tar.gz
          rm -f boost.tar.gz
          rm -rf boost
          mv "$name" boost

      - name: Stage boost headers (Linux, macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ env.BOOST_PATH }}
        run: |
          ./bootstrap.sh
          ./b2 stage --stagedir=./ --with-headers

      # vcpkg's b2 rather than the bundled bootstrap.bat, which needs a
      # compiler probe that is flaky under the runner's MSVC layout.
      - name: Stage boost headers (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.BOOST_PATH }}
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/installed/$env:VCPKG_TRIPLET/tools/boost-build/b2.exe" stage toolset=msvc --stagedir=.\ --with-headers

      # ------------------------------------------------------------------- Qt

      # Qt is the slowest dependency to build from source by a wide margin, so
      # it comes prebuilt. The archive list is the reason this step takes two
      # minutes instead of the thirty-five the first attempt spent here:
      # without it, aqtinstall pulls every module Qt publishes. qbittorrent-nox
      # needs Core, Network, Sql and Xml (all in qtbase) plus LinguistTools (in
      # qttools); qtdeclarative is here only because qttools declares a hard
      # dependency on it.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ needs.pin.outputs.qt }}
          arch: ${{ matrix.qt_arch }}
          archives: ${{ matrix.qt_archives }}
          cache: true

      # ----------------------------------------------------------- libtorrent

      # Built statically and installed, so the binary we ship does not depend
      # on a libtorrent being present on the user's machine.
      - name: Build libtorrent
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch "v${{ needs.pin.outputs.libtorrent }}" --depth 1 --recurse-submodules \
            https://github.com/arvidn/libtorrent.git "$LIBTORRENT_PATH"
          cd "$LIBTORRENT_PATH"
          # Expanded below as ${extra[@]+"..."} rather than plain "${extra[@]}".
          # macOS runners still ship bash 3.2, where expanding an empty array
          # under `set -u` is an unbound-variable error rather than nothing.
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            extra+=(
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
              -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"
              -DCMAKE_INSTALL_PREFIX="$LIBTORRENT_PATH/install"
              -Dstatic_runtime=OFF
            )
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_STANDARD=20 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBOOST_ROOT="$BOOST_PATH/lib/cmake" \
            -Ddeprecated-functions=OFF \
            ${extra[@]+"${extra[@]}"}
          cmake --build build
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --install build
          else
            sudo cmake --install build
          fi

      # ---------------------------------------------------------- qbittorrent

      # -DGUI=OFF is the headless target, supported upstream. WEBUI stays on,
      # since it is the only interface rigseed uses. STACKTRACE off keeps the
      # binary smaller and drops a dependency we have no use for.
      - name: Configure qbittorrent-nox
        working-directory: qbittorrent
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            extra+=(
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
              -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"
              -DLibtorrentRasterbar_DIR="$LIBTORRENT_PATH/install/lib/cmake/LibtorrentRasterbar"
              -DMSVC_RUNTIME_DYNAMIC=ON
            )
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGUI=OFF \
            -DWEBUI=ON \
            -DSTACKTRACE=OFF \
            -DVERBOSE_CONFIGURE=ON \
            -DBOOST_ROOT="$BOOST_PATH/lib/cmake" \
            ${extra[@]+"${extra[@]}"}

      - name: Build qbittorrent-nox
        working-directory: qbittorrent
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --target qbt_update_translations
          cmake --build build

      # Cheap, and the only step that proves the thing links and starts rather
      # than merely compiling.
      - name: Smoke test
        working-directory: qbittorrent
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            build/qbittorrent-nox.app/Contents/MacOS/qbittorrent-nox -v
          else
            "build/${{ matrix.binary }}" -v
          fi

      - name: Stage the binary under its target triple
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          found=$(find qbittorrent/build -name '${{ matrix.binary }}' -type f | head -1)
          if [ -z "$found" ]; then
            echo "::error::no ${{ matrix.binary }} produced. Build layout may have changed."
            find qbittorrent/build -maxdepth 3 -type f -name 'qbittorrent*' || true
            exit 1
          fi
          # Tauri resolves sidecars by target triple, so the published name is
          # the name the app will look for.
          ext=""
          case "${{ matrix.binary }}" in *.exe) ext=".exe";; esac
          staged="out/qbittorrent-nox-${{ matrix.triple }}$ext"
          cp "$found" "$staged"

          # RelWithDebInfo is upstream's build type and worth keeping, but GCC
          # embeds the debug info in the executable rather than putting it
          # beside one: the first Linux artifact was 270 MB against 21 MB for
          # macOS, which separates into a .dSYM, and 20 MB for MSVC, which
          # writes a .pdb. We ship the binary, not the symbols.
          before=$(wc -c < "$staged")
          if command -v strip >/dev/null 2>&1; then
            strip --strip-unneeded "$staged" 2>/dev/null || strip "$staged" || true
          fi
          after=$(wc -c < "$staged")
          echo "size: $before -> $after bytes"

          # A sidecar this large is a packaging problem rather than a curiosity,
          # so fail rather than publish one quietly.
          if [ "$after" -gt 120000000 ]; then
            echo "::error::$staged is $after bytes after stripping, which is far outside the expected range."
            exit 1
          fi
          ls -la out

      # ------------------------------------------------------- runtime bundle

      # The sidecar cannot ship as a lone executable. `-DGUI=OFF` still links
      # Qt Core, Network, Sql and Xml, and none of those are on an end user's
      # machine; what else has to travel differs per platform. Each is
      # collected with the tool that exists for it, laid out as the app will
      # ship it, and then proved by running the binary with the build
      # machine's own Qt taken off the search path.
      #
      # That last part is the whole point. A bundle that is missing a library
      # still runs perfectly on the machine that built it.

      - name: Collect the runtime libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="qbittorrent-nox-${{ matrix.triple }}"
          mkdir -p bundle/lib
          cp "out/$bin" "bundle/$bin"

          # Derived from what the binary actually resolves rather than from a
          # list written down once. A Qt version that adds a dependency would
          # otherwise ship a bundle that is quietly incomplete.
          collect() {
            ldd "$1" 2>/dev/null | awk '{print $3}' | grep -v '^$' || true
          }

          for dep in $(collect "bundle/$bin"); do
            case "$dep" in "$QT_ROOT_DIR"/*) cp -Lv "$dep" bundle/lib/ ;; esac
          done

          # Qt's libraries resolve each other, and ICU is pulled in by Qt
          # rather than by nox, so it never appears in the binary's own list.
          # Three passes is one more than the depth Qt actually has.
          for pass in 1 2 3; do
            for lib in bundle/lib/*.so*; do
              for dep in $(collect "$lib"); do
                case "$dep" in
                  "$QT_ROOT_DIR"/*)
                    name=$(basename "$dep")
                    [ -e "bundle/lib/$name" ] || cp -Lv "$dep" "bundle/lib/$name"
                    ;;
                esac
              done
            done
          done

          # Relative to the binary, so the bundle can be installed anywhere and
          # needs no LD_LIBRARY_PATH from whatever spawns it. Single-quoted:
          # $ORIGIN is read by the loader, not by this shell.
          #
          # Two candidates, because Tauri puts externalBin beside the app
          # executable and resources somewhere else again, and only one of
          # those is a directory we control the name of. Naming both costs
          # nothing and removes a guess about a layout that does not exist yet.
          patchelf --set-rpath '$ORIGIN/lib:$ORIGIN/../lib/rigseed/lib' "bundle/$bin"
          for lib in bundle/lib/*.so*; do
            patchelf --set-rpath '$ORIGIN' "$lib"
          done

          ls -la bundle bundle/lib

      - name: Collect the runtime libraries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bin="qbittorrent-nox-${{ matrix.triple }}"
          mkdir -p bundle/lib
          cp "out/$bin" "bundle/$bin"

          # The closure of what the binary actually names, the same way the
          # Linux step works, rather than whatever macdeployqt decided to copy.
          #
          # macdeployqt was the first approach and it over-collected badly: it
          # deploys plugins as well as libraries, and the plugins drag in QtGui
          # and QtWidgets, which is 30 MB of desktop toolkit in a build
          # configured -DGUI=OFF. It also left every framework duplicated as a
          # loose file beside its own .framework directory, because a framework
          # install name looks like an ordinary path to anything that only
          # calls basename on it.
          #
          # Walking the references costs a few lines and gets exactly the four
          # frameworks the binary links, plus the OpenSSL pair.

          # An install name to the thing on disk it refers to, or nothing.
          resolve() {
            case "$1" in
              @rpath/*) echo "$QT_ROOT_DIR/lib/${1#@rpath/}" ;;
              /*) echo "$1" ;;
              *) echo "" ;;
            esac
          }

          # Copy a dependency into lib, keeping a framework a framework, and
          # print the install name it should be referred to by from now on.
          bring_in() {
            local ref="$1" src
            src=$(resolve "$ref")
            [ -n "$src" ] || return 1

            case "$ref" in
              *.framework/*)
                local rest="${ref#*.framework/}"
                local stem="${ref%%.framework/*}"
                local fw="${stem##*/}"
                if [ ! -d "bundle/lib/$fw.framework" ]; then
                  local srcstem="${src%%.framework/*}"
                  cp -R "$srcstem.framework" bundle/lib/ || return 1
                  echo "collected $fw.framework" >&2
                fi
                echo "@rpath/$fw.framework/$rest"
                ;;
              *)
                local base="${ref##*/}"
                if [ ! -e "bundle/lib/$base" ]; then
                  cp -L "$src" "bundle/lib/$base" || return 1
                  echo "collected $base" >&2
                fi
                echo "@rpath/$base"
                ;;
            esac
          }

          # Rewrite one Mach-O so every non-system reference is @rpath, bringing
          # in whatever it names. System libraries stay: they are on every Mac
          # and shipping copies would be worse than pointless.
          relink() {
            local target="$1" ref new
            chmod u+w "$target"
            for ref in $(otool -L "$target" | tail -n +2 | awk '{print $1}'); do
              case "$ref" in
                /usr/lib/*|/System/*|@loader_path/*) continue ;;
              esac
              if new=$(bring_in "$ref"); then
                [ "$new" = "$ref" ] || install_name_tool -change "$ref" "$new" "$target"
              fi
            done
          }

          relink "bundle/$bin"

          # Until nothing new arrives: a framework brought in on one round names
          # others that are not here yet. Qt is two deep, so three rounds is one
          # spare and the loop is cheap.
          for round in 1 2 3; do
            for lib in bundle/lib/*.dylib; do
              [ -e "$lib" ] || continue
              install_name_tool -id "@rpath/${lib##*/}" "$lib" 2>/dev/null || true
              relink "$lib"
            done
            for fw in bundle/lib/*.framework; do
              [ -d "$fw" ] || continue
              name=$(basename "$fw" .framework)
              inner="$fw/Versions/A/$name"
              [ -f "$inner" ] || continue
              chmod u+w "$inner"
              install_name_tool -id "@rpath/$name.framework/Versions/A/$name" "$inner"
              # From lib/X.framework/Versions/A, three levels up is lib, so a
              # framework can find its siblings by the same @rpath the binary
              # uses.
              install_name_tool -add_rpath "@loader_path/../../.." "$inner" 2>/dev/null || true
              relink "$inner"
            done
          done

          install_name_tool -add_rpath "@executable_path/lib" "bundle/$bin"
          # The .app case: externalBin lands in Contents/MacOS and resources in
          # Contents/Resources. Searched in order, so the sibling wins when both
          # exist and the packaged layout still resolves when it does not.
          install_name_tool -add_rpath "@executable_path/../Resources/lib" "bundle/$bin"

          # Stripping invalidated whatever signature the binary carried, and an
          # arm64 Mach-O with a modified load command and no signature will not
          # launch at all. Ad-hoc is enough here; real signing happens when the
          # app itself is signed, and has to come after this.
          codesign --force --sign - --timestamp=none "bundle/$bin"
          for lib in bundle/lib/*.dylib bundle/lib/*.framework; do
            [ -e "$lib" ] || continue
            codesign --force --sign - --timestamp=none "$lib"
          done

          # Anything still absolute, or still assuming a layout we are not
          # shipping, fails here where we can name the file rather than two
          # steps later as Abort trap: 6.
          bad=0
          for target in "bundle/$bin" bundle/lib/*.dylib; do
            [ -e "$target" ] || continue
            for ref in $(otool -L "$target" | tail -n +2 | awk '{print $1}'); do
              case "$ref" in
                /usr/lib/*|/System/*|@rpath/*|@loader_path/*) ;;
                *) echo "::error::$target still references $ref"; bad=1 ;;
              esac
            done
          done

          # A GUI framework in a -DGUI=OFF build means the collection widened
          # again, which is worth failing over rather than shipping quietly.
          for unwanted in QtGui QtWidgets QtQml QtQuick; do
            if [ -e "bundle/lib/$unwanted.framework" ]; then
              echo "::error::$unwanted was collected into a headless build"
              bad=1
            fi
          done
          [ "$bad" = 0 ] || exit 1

          echo "--- binary ---"; otool -L "bundle/$bin"
          ls -la bundle bundle/lib

      - name: Collect the runtime libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="qbittorrent-nox-${{ matrix.triple }}.exe"
          mkdir -p bundle
          cp "out/$bin" "bundle/$bin"

          # windeployqt reads the import table and copies what it finds, which
          # on a GUI-less build is the four Qt DLLs and nothing else. Windows
          # resolves imports from the executable's own directory first, so
          # there is no path to rewrite and no lib subdirectory to justify.
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations \
            --no-system-d3d-compiler --no-opengl-sw --no-compiler-runtime \
            --dir bundle "bundle/$bin"

          # The MSVC runtime is the one thing windeployqt is told not to fetch,
          # because --compiler-runtime drags in the whole redistributable
          # installer rather than the DLLs.
          #
          # Chosen rather than taken. The first version of this said
          # `find ... | grep -i x64 | head -1` and got the onecore variant of
          # the 2019 runtime out of a 2022 install, for a binary compiled with
          # the 2022 toolset. onecore is for a different Windows edition, and
          # nothing here could have noticed: the runner has the real runtime in
          # System32, so the standalone check passed on a machine that was
          # never going to need what we shipped.
          #
          # Desktop rather than onecore, highest version rather than first
          # found, and the choice is printed because it is the kind of thing
          # that goes wrong silently.
          redist=$(find "/c/Program Files/Microsoft Visual Studio" -type d -path '*/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT' 2>/dev/null \
            | grep -v onecore | sort -V | tail -1)
          if [ -z "$redist" ]; then
            echo "::error::no desktop x64 MSVC redistributable found. The image layout may have changed."
            find "/c/Program Files/Microsoft Visual Studio" -type d -name 'Microsoft.VC*.CRT' 2>/dev/null | head -20
            exit 1
          fi
          echo "CRT from: $redist"

          # VC143 is the 2022 toolset, which is what qt_arch names and what the
          # binary is built with. Anything older means the selection drifted.
          case "$redist" in
            *Microsoft.VC14[3-9].CRT) ;;
            *) echo "::error::$redist is older than the toolset this binary was built with"; exit 1 ;;
          esac

          cp -v "$redist"/msvcp140*.dll "$redist"/vcruntime140*.dll bundle/

          ls -la bundle

      # A bundle missing a library still runs on the machine that built it,
      # because the build machine has Qt installed. Moving Qt out of the way
      # is what turns "it started" into evidence.
      - name: Prove the bundle stands alone
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          bin="bundle/qbittorrent-nox-${{ matrix.triple }}$ext"

          # Hide the build machine's Qt for the duration. On Linux and macOS
          # the rewritten RPATH already makes this meaningful, since the
          # original Qt prefix is no longer named in the binary at all. On
          # Windows it is the whole test: the loader searches PATH, and
          # install-qt-action puts Qt's bin on it.
          hidden="$RUNNER_TEMP/qt-hidden"
          moved=0
          if mv "$QT_ROOT_DIR" "$hidden" 2>/dev/null; then
            moved=1
            trap 'mv "$hidden" "$QT_ROOT_DIR" || true' EXIT
          else
            echo "::warning::could not move $QT_ROOT_DIR aside, so this check is weaker than intended"
          fi

          env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u DYLD_FRAMEWORK_PATH "$bin" -v

          if [ "$moved" = 1 ]; then
            echo "Ran with the build machine's Qt moved out of the way."
          fi

      - name: Stage the runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) name="qbittorrent-nox-${{ matrix.triple }}.exe" ;;
            *) name="qbittorrent-nox-${{ matrix.triple }}" ;;
          esac

          # The executable is published on its own as well, so it is excluded
          # here rather than shipped twice in a release that is already large.
          tar -C bundle --exclude "$name" -czf "out/runtime-${{ matrix.triple }}.tar.gz" .
          ls -la out

      # Which shared libraries the binary still expects decides how it has to
      # be packaged: a lone executable if the list is all system libraries, a
      # directory of Qt libraries beside it otherwise. Recorded rather than
      # guessed at. Not fatal if the tool is missing.
      - name: Record runtime dependencies
        shell: bash
        continue-on-error: true
        run: |
          bin=$(find out -type f | head -1)
          {
            case "$RUNNER_OS" in
              Linux) ldd "$bin" ;;
              macOS) otool -L "$bin" ;;
              Windows) dumpbin //dependents "$bin" ;;
            esac
          } | tee "runtime-deps-${{ matrix.label }}.txt"

      - name: Checksum
        shell: bash
        working-directory: out
        run: |
          set -euo pipefail
          for f in *; do
            case "$f" in *.sha256) continue;; esac
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256";
            else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          cat ./*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.label }}
          path: out/*
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-deps-${{ matrix.label }}
          path: runtime-deps-${{ matrix.label }}.txt
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish the release
    needs: [pin, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the sidecar artifacts. The runtime-deps reports are diagnostics
      # for us, not something to attach to a public release.
      - uses: actions/download-artifact@v4
        with:
          path: staged
          pattern: sidecar-*
          merge-multiple: true

      # The GPL obligation from licenses/README.md. The binary and its
      # corresponding source have to be reachable from the same place, so the
      # source archive is attached to this release rather than linked.
      - name: Fetch the corresponding source
        run: scripts/fetch-sidecar-source.sh staged

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ needs.pin.outputs.release }}
          VERSION: ${{ needs.pin.outputs.version }}
          TAG: ${{ needs.pin.outputs.tag }}
          QT: ${{ needs.pin.outputs.qt }}
          LT: ${{ needs.pin.outputs.libtorrent }}
          BOOST: ${{ needs.pin.outputs.boost }}
        run: |
          set -euo pipefail
          ls -la staged

          # A heredoc rather than an inline --notes string: every line inside a
          # YAML block scalar has to stay indented, and release notes are the
          # one place that is easy to forget.
          cat > notes.md <<EOF
          Built from \`$TAG\` with \`-DGUI=OFF\`, against Qt $QT, libtorrent-rasterbar $LT and Boost $BOOST.

          Consumed by the release workflow, which downloads these rather than
          rebuilding. The corresponding source archive is attached here to
          satisfy GPLv3 section 6(d): the binary and its source are offered
          from the same place.
          EOF

          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE" staged/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "qbittorrent-nox $VERSION" \
              --notes-file notes.md \
              staged/*
          fi
