name: CI

# Runs on every pull request so a component branch is verified before it merges,
# not after. Kept deliberately fast: this gates the component and screen PRs.

on:
  pull_request:
    paths-ignore:
      - 'licenses/**'
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'licenses/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Every Tauri plugin exists twice, as a Rust crate and an npm package,
      # and the CLI refuses to build when a pair is on different minors. Nothing
      # else in CI runs the Tauri CLI: typecheck, lint, test and build never
      # touch it, so a mismatch stays invisible until a release build fails on
      # all three platforms at once, which is exactly how v0.1.4 failed.
      #
      # `tauri info` reads the manifests and resolves nothing, so this costs
      # seconds and needs no Rust toolchain.
      - name: Tauri crate and package versions agree
        run: |
          set -uo pipefail
          out=$(pnpm tauri info 2>&1) || true
          echo "$out"
          if printf '%s' "$out" | grep -qi 'version mismatched'; then
            echo "::error::A Tauri plugin's Rust crate and npm package are on different minor versions. The release build will refuse this on every platform. The offending pair is named above."
            exit 1
          fi
          echo "all Tauri crate and package pairs agree"

      # appstreamcli is the same validator a software centre and Flathub run,
      # so a file that fails here is a file that will be rejected there. It is
      # checked on every pull request rather than at release time because a
      # malformed metainfo should cost a red tick, not a failed release.
      # The README's badges are the only numbers on the front page and nothing
      # derives them, so they rot silently. The version badge had been reading
      # 0.1.3 since four releases before 0.1.7, which tells a visitor the
      # project stalled months ago.
      #
      # Only the badges that come from a file are checked. The test count used
      # to be one of these and is now the live Actions badge instead: a guard
      # on a test count fails every pull request that adds a test, which
      # teaches people to edit the badge rather than to trust the check.
      - name: README badges still match the files they describe
        run: |
          set -euo pipefail
          fail=0

          check() {
            label="$1"; want="$2"; pattern="$3"
            got=$(grep -oE "$pattern" README.md | head -1 | sed 's/.*-//')
            if [ "$got" != "$want" ]; then
              echo "::error file=README.md::the $label badge reads '$got' but the repository says '$want'"
              fail=1
            else
              echo "  ok  $label = $got"
            fi
          }

          check version "$(jq -r .version package.json)" 'version-[0-9][0-9.]*'
          check Tauri "$(jq -r '.dependencies["@tauri-apps/api"]' package.json | sed 's/[^0-9.]//g' | cut -d. -f1,2)" 'Tauri-[0-9][0-9.]*'
          check React "$(jq -r .dependencies.react package.json | sed 's/[^0-9.]//g' | cut -d. -f1,2)" 'React-[0-9][0-9.]*'

          # Rust is written as a floor, so the badge carries a trailing +.
          rust=$(grep -E '^rust-version' src-tauri/Cargo.toml | sed 's/.*"\(.*\)"/\1/' | cut -d. -f1,2)
          got=$(grep -oE 'Rust-[0-9][0-9.]*\+' README.md | head -1 | sed 's/Rust-//;s/+//')
          if [ "$got" != "$rust" ]; then
            echo "::error file=README.md::the Rust badge reads '$got+' but Cargo.toml sets rust-version to '$rust'"
            fail=1
          else
            echo "  ok  Rust = $got+"
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "every derived badge matches"

      - name: Validate the AppStream metainfo
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq appstream
          appstreamcli validate --no-net src-tauri/linux/dev.verastack.rigseed.metainfo.xml

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
