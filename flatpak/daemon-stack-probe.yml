# Everything qbittorrent-nox needs, built from source on the GNOME runtime,
# pinned to exactly what sidecar.json says rigseed ships.
#
# The versions here are NOT upstream Flathub's. org.qbittorrent.qBittorrent
# builds 5.2.4 against libtorrent 1.2 and boost 1.86 on the KDE runtime. This
# builds 5.2.3 against libtorrent 2.0.11 and boost 1.90.0, because that is the
# combination rigseed ships on Windows, macOS, the .deb, the .rpm and the
# AppImage, and sidecar.json records it as a tested pairing rather than an
# arbitrary one. A Flatpak on libtorrent 1.2 would be a different BitTorrent
# engine from every other rigseed build: different disk I/O, different v2
# torrent support, different memory behaviour. Same daemon everywhere is worth
# more than a recipe someone else already debugged.
#
# The checksums are literal, which is what Flathub requires, and they are not
# taken on trust: flatpak-builder verifies every one against the bytes it
# downloads, so a wrong value fails the build rather than shipping.
#
# The Qt ones come from download.qt.io's own mirrorbrain Digest header rather
# than from hashing a local copy. An earlier run hashed what it downloaded
# and got 196 bytes of 404 page for both Qt archives, identically, because
# the filename drops "opensource" at 6.8.3 and curl without --fail saves an
# error body and exits 0. Two wrongs that looked like one plausible hash.
app-id: dev.verastack.daemonstackprobe

runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: qbittorrent-nox

# Qt installs its whole development toolchain into /app/bin: qmake, qt-cmake,
# androiddeployqt, qdbus and the rest. None of it belongs in a shipped image.
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /mkspecs
  - /share/man
  - /bin/androiddeployqt*
  - /bin/qmake*
  - /bin/qt-cmake*
  - /bin/qt-configure-module
  - /bin/qtpaths*
  - /bin/qtplugininfo
  - /bin/qdbus*
  # lrelease and friends are build tools for qBittorrent's translations and
  # have no job at runtime.
  - /bin/lconvert
  - /bin/lrelease
  - /bin/lupdate

modules:
  # sidecar.json pins Qt 6.8.3. Core, Network, Sql and Xml is exactly what
  # CheckPackages.cmake asks for with GUI off, and the OpenSSL TLS backend
  # and SQLite driver arrive as plugins alongside them.
  - name: qtbase
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DQT_BUILD_EXAMPLES=OFF
      - -DQT_BUILD_TESTS=OFF
      - -DFEATURE_gui=OFF
      - -DFEATURE_network=ON
      - -DFEATURE_sql=ON
      - -DFEATURE_sql_sqlite=ON
      - -DFEATURE_xml=ON
      - -DFEATURE_concurrent=ON
      - -DFEATURE_openssl_linked=OFF
    sources:
      - type: archive
        url: https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtbase-everywhere-src-6.8.3.tar.xz
        sha256: 56001b905601bb9023d399f3ba780d7fa940f3e4861e496a7c490331f49e0b80

  # qBittorrent requires LinguistTools unconditionally and it is not in
  # qtbase. The GUI tools here need Widgets and disable themselves against a
  # GUI-less qtbase, leaving lrelease, lupdate and lconvert.
  - name: qttools
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DQT_BUILD_EXAMPLES=OFF
      - -DQT_BUILD_TESTS=OFF
      - -DFEATURE_assistant=OFF
      - -DFEATURE_designer=OFF
      - -DFEATURE_qdoc=OFF
      - -DFEATURE_pixeltool=OFF
      - -DFEATURE_distancefieldgenerator=OFF
    sources:
      - type: archive
        url: https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qttools-everywhere-src-6.8.3.tar.xz
        sha256: 02a4e219248b94f1333df843d25763f35251c1074cdc4fb5bda67d340f8c8b3a

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app
      - ./b2 install --with-headers cxxflags="$CXXFLAGS" linkflags="$LDFLAGS" -j $FLATPAK_BUILDER_N_JOBS
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.gz
        sha256: 5e93d582aff26868d581a52ae78c7d8edf3f3064742c6e77901a1f18a437eea9

  # The release tarball rather than the git repository. libtorrent vendors
  # several dependencies as submodules, and a git source would need every one
  # declared separately for an offline build; the release archive already
  # contains them.
  - name: libtorrent
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_CXX_STANDARD=20
      - -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - -Ddeprecated-functions=OFF
    sources:
      - type: archive
        url: https://github.com/arvidn/libtorrent/releases/download/v2.0.11/libtorrent-rasterbar-2.0.11.tar.gz
        sha256: f0db58580f4f29ade6cc40fa4ba80e2c9a70c90265cd77332d3cdec37ecf1e6d

  # GUI=OFF is what makes this qbittorrent-nox. DBUS follows it off on its
  # own, so no Qt6DBus is required either.
  - name: qbittorrent
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      cflags: '-fPIC'
      cxxflags: '-fPIC'
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - -DGUI=OFF
    sources:
      - type: archive
        url: https://github.com/qbittorrent/qBittorrent/archive/refs/tags/release-5.2.3.tar.gz
        sha256: a5f540cdfb0053f0ce1a1c62ccd92d08214f16bcb2c512569ec54d81531e541f
