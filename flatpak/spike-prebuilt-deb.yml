# A SPIKE, not a submission.
#
# The question this exists to answer, and nothing else: do the Qt 6 and ICU 73
# shared objects in rigseed's .deb, which are built on Ubuntu 22.04, actually
# load inside a Flatpak runtime? Tauri's own Flatpak guide warns that local
# .so files "are not built for the Flatpak runtime" and advises against them
# in a final build. rigseed's entire Linux sidecar depends on exactly that, so
# the warning is either decisive here or it is not, and arguing about it is
# slower than running it.
#
# If the answer is yes, the prebuilt-.deb route is viable and a real manifest
# can be built from this. If it is no, the alternative is org.kde.Platform,
# which ships Qt 6, with qbittorrent-nox built from source against it, and
# nothing bundled at all.
#
# Deliberately NOT suitable for Flathub as written: it installs a prebuilt
# binary from a release URL rather than building from source.
app-id: dev.verastack.rigseed

runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: rigseed

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The daemon listens locally and talks to trackers and peers. Without this
  # there is no point to any of it.
  - --share=network
  - --filesystem=xdg-download
  # The tray icon. Optional so a desktop without a watcher still starts.
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: rigseed
    buildsystem: simple
    build-commands:
      - ar x rigseed.deb
      - tar -xf data.tar.gz

      # The layout is kept exactly as the .deb has it, because that is the
      # whole point. qbittorrent-nox carries RUNPATH $ORIGIN/../lib/rigseed/lib,
      # so a binary in /app/bin finds its Qt in /app/lib/rigseed/lib and the
      # relocation the build workflow does keeps working untouched.
      - install -Dm755 usr/bin/rigseed /app/bin/rigseed
      - install -Dm755 usr/bin/qbittorrent-nox /app/bin/qbittorrent-nox
      - mkdir -p /app/lib/rigseed
      - cp -r usr/lib/rigseed/. /app/lib/rigseed/

      # Renamed to the app id, which is what Flathub requires and what the
      # bundler cannot do for us: it names the entry after productName.
      - install -Dm644 usr/share/applications/rigseed.desktop /app/share/applications/dev.verastack.rigseed.desktop
      - desktop-file-edit --set-icon=dev.verastack.rigseed /app/share/applications/dev.verastack.rigseed.desktop

      # From the repository, not from the package. v0.1.7 predates the
      # metainfo, so the released .deb has none; the workflow copies the
      # current one in beside this manifest before building.
      - install -Dm644 dev.verastack.rigseed.metainfo.xml /app/share/metainfo/dev.verastack.rigseed.metainfo.xml

      - install -Dm644 usr/share/icons/hicolor/128x128/apps/rigseed.png /app/share/icons/hicolor/128x128/apps/dev.verastack.rigseed.png
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/rigseed.png /app/share/icons/hicolor/32x32/apps/dev.verastack.rigseed.png
    sources:
      - type: file
        url: https://github.com/verastack-labs/rigseed-app/releases/download/v0.1.7/rigseed_0.1.7_amd64.deb
        sha256: 4dfd5a2c079576c64f2c6dfe3917a63a9a6f0e28e8225f4b70d88b020db76373
        dest-filename: rigseed.deb
      - type: file
        path: dev.verastack.rigseed.metainfo.xml
