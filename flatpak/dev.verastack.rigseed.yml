# The Flathub manifest for rigseed.
#
# rigseed is two programs with opposite needs. The app is Tauri and wants
# webkit2gtk, which the GNOME runtime carries and the KDE runtime does not.
# qbittorrent-nox wants Qt 6, which the KDE runtime carries and GNOME does
# not. Both runtimes were checked rather than assumed: neither has both. So
# the runtime is GNOME, because WebKitGTK is far too large to build on a
# Flathub worker and a non-GUI Qt is not.
#
# The daemon versions are the ones sidecar.json pins, not the ones upstream's
# own Flathub manifest uses. org.qbittorrent.qBittorrent builds 5.2.4 against
# libtorrent 1.2; rigseed ships 5.2.3 against libtorrent 2.0.11 on every
# other platform. Taking upstream's would put a different BitTorrent engine
# in the Flatpak than in the .deb: different disk I/O, different v2 torrent
# support, different memory behaviour. One daemon everywhere is worth more
# than a recipe somebody else already debugged.
#
# Nothing here is a prebuilt binary. Flathub requires source builds, and the
# .deb, .rpm and AppImage are untouched by any of this: they still ship the
# prebuilt sidecar from sidecar.json exactly as before.
app-id: dev.verastack.rigseed

runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: rigseed

# Neither toolchain is in the base SDK. They are mounted under
# /usr/lib/sdk and put on PATH by the rigseed module's append-path.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The daemon listens locally and talks to trackers and peers.
  - --share=network
  # Where downloads go. xdg-download rather than host: a torrent client that
  # asks for the whole filesystem on install is asking for a trust it has not
  # earned, and the portal covers anywhere else the user picks.
  - --filesystem=xdg-download
  # The tray icon. Optional, so a desktop with no watcher still starts.
  - --talk-name=org.kde.StatusNotifierWatcher

# Qt installs its whole development toolchain into /app/bin: qmake, qt-cmake,
# androiddeployqt, qdbus and the rest. None of it belongs in a shipped image.
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.a
  - /lib/*.la
  - /mkspecs
  - /share/man
  - /bin/androiddeployqt*
  - /bin/qmake*
  - /bin/qt-cmake*
  - /bin/qt-configure-module
  - /bin/qtpaths*
  - /bin/qtplugininfo
  - /bin/qdbus*
  # lrelease and friends are build tools for qBittorrent's translations and
  # have no job at runtime.
  - /bin/lconvert
  - /bin/lrelease
  - /bin/lupdate

modules:
  # sidecar.json pins Qt 6.8.3. Core, Network, Sql and Xml is exactly what
  # CheckPackages.cmake asks for with GUI off, and the OpenSSL TLS backend
  # and SQLite driver arrive as plugins alongside them.
  - name: qtbase
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DQT_BUILD_EXAMPLES=OFF
      - -DQT_BUILD_TESTS=OFF
      - -DFEATURE_gui=OFF
      - -DFEATURE_network=ON
      - -DFEATURE_sql=ON
      - -DFEATURE_sql_sqlite=ON
      - -DFEATURE_xml=ON
      - -DFEATURE_concurrent=ON
      - -DFEATURE_openssl_linked=OFF
    sources:
      - type: archive
        url: https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtbase-everywhere-src-6.8.3.tar.xz
        sha256: 56001b905601bb9023d399f3ba780d7fa940f3e4861e496a7c490331f49e0b80

  # qBittorrent requires LinguistTools unconditionally and it is not in
  # qtbase. The GUI tools here need Widgets and disable themselves against a
  # GUI-less qtbase, leaving lrelease, lupdate and lconvert.
  - name: qttools
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DQT_BUILD_EXAMPLES=OFF
      - -DQT_BUILD_TESTS=OFF
      - -DFEATURE_assistant=OFF
      - -DFEATURE_designer=OFF
      - -DFEATURE_qdoc=OFF
      - -DFEATURE_pixeltool=OFF
      - -DFEATURE_distancefieldgenerator=OFF
    sources:
      - type: archive
        url: https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qttools-everywhere-src-6.8.3.tar.xz
        sha256: 02a4e219248b94f1333df843d25763f35251c1074cdc4fb5bda67d340f8c8b3a

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app
      - ./b2 install --with-headers cxxflags="$CXXFLAGS" linkflags="$LDFLAGS" -j $FLATPAK_BUILDER_N_JOBS
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.gz
        sha256: 5e93d582aff26868d581a52ae78c7d8edf3f3064742c6e77901a1f18a437eea9

  # The release tarball rather than the git repository. libtorrent vendors
  # several dependencies as submodules, and a git source would need every one
  # declared separately for an offline build; the release archive already
  # contains them.
  - name: libtorrent
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_CXX_STANDARD=20
      - -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - -Ddeprecated-functions=OFF
    sources:
      - type: archive
        url: https://github.com/arvidn/libtorrent/releases/download/v2.0.11/libtorrent-rasterbar-2.0.11.tar.gz
        sha256: f0db58580f4f29ade6cc40fa4ba80e2c9a70c90265cd77332d3cdec37ecf1e6d

  # GUI=OFF is what makes this qbittorrent-nox. DBUS follows it off on its
  # own, so no Qt6DBus is required either.
  - name: qbittorrent
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      cflags: '-fPIC'
      cxxflags: '-fPIC'
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - -DGUI=OFF
    sources:
      - type: archive
        url: https://github.com/qbittorrent/qBittorrent/archive/refs/tags/release-5.2.3.tar.gz
        sha256: a5f540cdfb0053f0ce1a1c62ccd92d08214f16bcb2c512569ec54d81531e541f

  # rigseed itself: the Rust binary, its frontend, and the metadata a software
  # centre reads.
  #
  # The build is offline, so every crate and every npm package is declared in
  # the two generated source lists beside this file. flatpak/README.md says
  # how to regenerate them; the short version is that they come from
  # Cargo.lock and pnpm-lock.yaml and are never hand-edited.
  #
  # cargo build rather than tauri build. The bundler's job is to produce a
  # .deb or an AppImage, and inside a Flatpak there is nothing for it to
  # produce: the binary goes straight to /app/bin and flatpak-builder makes
  # the package.
  - name: rigseed
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
      env:
        CARGO_HOME: /run/build/rigseed/cargo
    build-commands:
      # Point cargo at the vendored crates rather than crates.io, which the
      # sandbox cannot reach.
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml --verbose

      # pnpm ships in neither the base SDK nor the node extension, and
      # corepack would try to download it, which the sandbox forbids. The
      # published tarball is a declared source instead, pinned to the exact
      # version package.json names, and run straight off disk.
      - node pnpm/bin/pnpm.cjs --offline install --frozen-lockfile
      - node pnpm/bin/pnpm.cjs --offline run build

      # Tauri's build script checks that every externalBin exists before it
      # will compile, and the one it wants is the daemon the previous module
      # just built. Copied under the target triple the bundler expects, so
      # the check passes without the configuration being edited.
      - install -Dm755 /app/bin/qbittorrent-nox src-tauri/binaries/qbittorrent-nox-x86_64-unknown-linux-gnu
      - cargo --offline build --release --manifest-path src-tauri/Cargo.toml

      - install -Dm755 src-tauri/target/release/rigseed /app/bin/rigseed

      # Named for the app id, which is what Flathub requires and what the
      # bundler cannot do: it names the entry after productName. The .deb and
      # .rpm keep rigseed.desktop, so the launchable is rewritten to match
      # what is installed here rather than what is installed there.
      - install -Dm644 src-tauri/linux/rigseed.desktop /app/share/applications/dev.verastack.rigseed.desktop
      - desktop-file-edit --set-key=Exec --set-value=rigseed --set-icon=dev.verastack.rigseed /app/share/applications/dev.verastack.rigseed.desktop
      - install -Dm644 src-tauri/linux/dev.verastack.rigseed.metainfo.xml /app/share/metainfo/dev.verastack.rigseed.metainfo.xml
      - sed -i "s|>rigseed.desktop<|>dev.verastack.rigseed.desktop<|" /app/share/metainfo/dev.verastack.rigseed.metainfo.xml

      - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/dev.verastack.rigseed.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/dev.verastack.rigseed.png
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/dev.verastack.rigseed.png
    sources:
      - type: dir
        path: ..
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.17.0.tgz
        sha512: cca3cea332ad254bb84145f966d19f4879615210346fc92c79a047f23a0d7b3cca3c3792f0076ba1f1831d277efbcf0a9119b31a9a60eca7fb3d6231f331ef72
        dest: pnpm
        strip-components: 1
      - cargo-sources.json
      - node-sources.json
