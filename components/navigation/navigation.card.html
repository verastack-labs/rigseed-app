<!-- @dsCard group="Components" viewport="700x420" subtitle="Rail, filters, tabs and the three-dot menu" name="Navigation" -->
<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg);font-family:var(--font-ui);color:var(--text)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const NS = (() => {
  const want = ['NavRail','FilterRow','TabBar','ContextMenu'];
  for (const k of Object.keys(window)) {
    const v = window[k];
    if (v && typeof v === 'object' && want.every(n => typeof v[n] === 'function')) return v;
  }
  return {};
})();
const { NavRail, FilterRow, TabBar, ContextMenu, IconButton } = NS;

const I = ({ d, s = 17 }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d={d} /></svg>
);

function Demo() {
  const [open, setOpen] = React.useState(true);
  const [nav, setNav] = React.useState('transfers');
  const [tab, setTab] = React.useState('general');
  const [menu, setMenu] = React.useState(false);

  return (
    <div style={{ position: 'relative', height: 420, overflow: 'hidden' }}>
      <NavRail
        expanded={open}
        onToggle={() => setOpen(v => !v)}
        active={nav}
        onSelect={setNav}
        items={[
          { key: 'transfers', label: 'Transfers', icon: <I d="M4 6h16M4 12h16M4 18h10" /> },
          { key: 'search', label: 'Search', icon: <I d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3" /> },
          { key: 'cats', label: 'Categories & tags', icon: <I d="M4 6h7l2 3h7v9H4z" /> },
          { key: 'logs', label: 'Logs', icon: <I d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4" /> },
          { key: 'settings', label: 'Settings', icon: <I d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" /> },
        ]}
      />
      <div style={{ paddingLeft: 76, paddingRight: 18, paddingTop: 16, display: 'flex', gap: 20 }}>
        <div style={{ width: 210, display: 'flex', flexDirection: 'column', gap: 3 }}>
          <FilterRow icon={<I d="M4 6h16M4 12h16M4 18h10" s={14} />} label="All torrents" count={18} active />
          <FilterRow icon={<I d="M12 4v12M7 12l5 5 5-5" s={14} />} label="Downloading" count={4} />
          <FilterRow icon={<I d="M12 20V8M7 12l5-5 5 5" s={14} />} label="Seeding" count={11} />
          <FilterRow dot="var(--swatch-mustard)" label="linux-isos" count={12} />
          <FilterRow dot="var(--swatch-lavender)" label="archive" count={3} />
        </div>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 16 }}>
          <TabBar value={tab} onChange={setTab} tabs={[
            { value: 'general', label: 'General' },
            { value: 'files', label: 'Files', count: 7 },
            { value: 'trackers', label: 'Trackers', count: 4 },
            { value: 'peers', label: 'Peers', count: 6 },
            { value: 'speed', label: 'Speed' },
          ]} />
          <div style={{ position: 'relative', alignSelf: 'flex-start', zIndex: menu ? 30 : 1 }}>
            <IconButton title="More" active={menu} onClick={(e) => { e.stopPropagation(); setMenu(v => !v); }}>
              <I d="M12 6.5h.01M12 12h.01M12 17.5h.01" s={15} />
            </IconButton>
            <ContextMenu open={menu} onClose={() => setMenu(false)} items={[
              { label: 'Resume', icon: <I d="M8 5.5v13l10-6.5z" s={14} /> },
              { label: 'Pause', icon: <I d="M9 5v14M15 5v14" s={14} /> },
              { label: 'Force recheck', icon: <I d="M4 12a8 8 0 1 1 2.3 5.7M4 12V7m0 5h5" s={14} /> },
              { separator: true },
              { label: 'Copy magnet link', icon: <I d="M6 5v7a6 6 0 0 0 12 0V5h-4v7a2 2 0 0 1-4 0V5z" s={14} /> },
              { separator: true },
              { label: 'Remove', icon: <I d="M5 7h14M9 7V5h6v2M7 7l1 12h8l1-12" s={14} />, danger: true },
            ]} />
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
