<!-- @dsCard group="Colors" viewport="700x150" subtitle="Three weights of neutral, plus accent-on" name="Text tones" -->
<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<div class="col" style="gap:9px">
  <span style="font-size:14px;font-weight:600;color:var(--text)">text — body copy, titles, values</span>
  <span style="font-size:13px;color:var(--text-dim)">text-dim — hints, secondary lines, inactive rows</span>
  <span style="font-size:12px;color:var(--text-dimmer)">text-dimmer — section headers, footer, disabled</span>
  <span style="font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-on);padding:5px 10px;border-radius:7px;align-self:flex-start">accent-on — text on a filled accent</span>
</div></body></html>
