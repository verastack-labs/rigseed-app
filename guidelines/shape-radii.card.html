<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4px controls up to 14px modals, 20px pills" name="Corner radii" -->
<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<div class="row" style="gap:12px">
<div class="col" style="align-items:center;gap:5px"><div style="width:58px;height:44px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)"></div><span class="val">4px</span><span style="font-size:9px;color:var(--text-dimmer)">checkbox</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:58px;height:44px;border-radius:7px;background:var(--surface2);border:1px solid var(--line)"></div><span class="val">7px</span><span style="font-size:9px;color:var(--text-dimmer)">row</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:58px;height:44px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)"></div><span class="val">8px</span><span style="font-size:9px;color:var(--text-dimmer)">button</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:58px;height:44px;border-radius:9px;background:var(--surface2);border:1px solid var(--line)"></div><span class="val">9px</span><span style="font-size:9px;color:var(--text-dimmer)">nav item</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:58px;height:44px;border-radius:11px;background:var(--surface2);border:1px solid var(--line)"></div><span class="val">11px</span><span style="font-size:9px;color:var(--text-dimmer)">card</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:58px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)"></div><span class="val">12px</span><span style="font-size:9px;color:var(--text-dimmer)">table</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:58px;height:44px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)"></div><span class="val">14px</span><span style="font-size:9px;color:var(--text-dimmer)">modal</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:58px;height:44px;border-radius:20px;background:var(--surface2);border:1px solid var(--line)"></div><span class="val">20px</span><span style="font-size:9px;color:var(--text-dimmer)">chip</span></div>
</div></body></html>
