<!-- @dsCard group="Colors" viewport="700x170" subtitle="The accent is mixed into every neutral surface" name="Accent tinting" -->
<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<div class="row" style="gap:22px">

<div data-mode="dark" data-accent="dustblue" class="col" style="gap:6px">
  <div style="display:flex">
    <div style="width:36px;height:44px;background:var(--bg)"></div><div style="width:36px;height:44px;background:var(--sidebar-bg)"></div><div style="width:36px;height:44px;background:var(--surface)"></div><div style="width:36px;height:44px;background:var(--surface2)"></div><div style="width:36px;height:44px;background:var(--line)"></div>
  </div>
  <span class="val">dustblue</span>
</div>
<div data-mode="dark" data-accent="sage" class="col" style="gap:6px">
  <div style="display:flex">
    <div style="width:36px;height:44px;background:var(--bg)"></div><div style="width:36px;height:44px;background:var(--sidebar-bg)"></div><div style="width:36px;height:44px;background:var(--surface)"></div><div style="width:36px;height:44px;background:var(--surface2)"></div><div style="width:36px;height:44px;background:var(--line)"></div>
  </div>
  <span class="val">sage</span>
</div>
<div data-mode="dark" data-accent="terracotta" class="col" style="gap:6px">
  <div style="display:flex">
    <div style="width:36px;height:44px;background:var(--bg)"></div><div style="width:36px;height:44px;background:var(--sidebar-bg)"></div><div style="width:36px;height:44px;background:var(--surface)"></div><div style="width:36px;height:44px;background:var(--surface2)"></div><div style="width:36px;height:44px;background:var(--line)"></div>
  </div>
  <span class="val">terracotta</span>
</div>
</div>
<div class="val" style="margin-top:12px">bg · sidebar · surface · surface2 · line — same neutrals, tinted 7–14% by the accent</div></body></html>
