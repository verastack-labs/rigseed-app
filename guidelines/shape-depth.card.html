<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Cards are flat. Only floating things cast shadows." name="Depth" -->
<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<div class="row" style="gap:16px;padding:6px 0 14px">
<div class="col" style="align-items:center;gap:7px"><div style="width:118px;height:52px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:none"></div><span style="font-size:10px;color:var(--text-dim)">card at rest</span></div><div class="col" style="align-items:center;gap:7px"><div style="width:118px;height:52px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-card)"></div><span style="font-size:10px;color:var(--text-dim)">menu</span></div><div class="col" style="align-items:center;gap:7px"><div style="width:118px;height:52px;border-radius:11px;background:var(--accent);border:1px solid var(--line);box-shadow:var(--shadow-fab)"></div><span style="font-size:10px;color:var(--text-dim)">FAB</span></div><div class="col" style="align-items:center;gap:7px"><div style="width:118px;height:52px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-modal)"></div><span style="font-size:10px;color:var(--text-dim)">modal</span></div>
</div></body></html>
