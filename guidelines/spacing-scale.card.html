<!-- @dsCard group="Spacing" viewport="700x140" subtitle="Not a strict 4px grid — half-steps are intentional" name="Spacing scale" -->
<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<div class="row" style="align-items:flex-end;gap:8px">
<div class="col" style="align-items:center;gap:5px"><div style="width:3px;height:3px;background:var(--accent);border-radius:3px"></div><span class="val">3</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:4px;height:4px;background:var(--accent);border-radius:3px"></div><span class="val">4</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:6px;height:6px;background:var(--accent);border-radius:3px"></div><span class="val">6</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:8px;height:8px;background:var(--accent);border-radius:3px"></div><span class="val">8</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:10px;height:10px;background:var(--accent);border-radius:3px"></div><span class="val">10</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:12px;height:12px;background:var(--accent);border-radius:3px"></div><span class="val">12</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:14px;height:14px;background:var(--accent);border-radius:3px"></div><span class="val">14</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:16px;height:16px;background:var(--accent);border-radius:3px"></div><span class="val">16</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:18px;height:18px;background:var(--accent);border-radius:3px"></div><span class="val">18</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:22px;height:22px;background:var(--accent);border-radius:3px"></div><span class="val">22</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:24px;height:24px;background:var(--accent);border-radius:3px"></div><span class="val">24</span></div><div class="col" style="align-items:center;gap:5px"><div style="width:30px;height:30px;background:var(--accent);border-radius:3px"></div><span class="val">30</span></div>
</div></body></html>
