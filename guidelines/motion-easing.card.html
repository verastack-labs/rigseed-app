<!-- @dsCard group="Motion" viewport="700x170" subtitle="Overshoot to expand, plain ease for colour, never linear" name="Easing" -->
<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<style>
@keyframes slide{0%,10%{transform:translateX(0)}60%,100%{transform:translateX(150px)}}
.t{width:34px;height:26px;border-radius:7px;background:var(--accent);animation:slide 2.6s infinite alternate}
</style>
<div class="col" style="gap:9px">
<div style="display:flex;align-items:center;gap:12px"><span style="font-size:10.5px;width:64px;color:var(--text-dim)">overshoot</span><div style="width:190px;background:var(--surface2);border-radius:8px;padding:2px"><div class="t" style="animation-timing-function:cubic-bezier(0.34,1.56,0.64,1)"></div></div><span class="val">cubic-bezier(0.34,1.56,0.64,1)</span></div><div style="display:flex;align-items:center;gap:12px"><span style="font-size:10.5px;width:64px;color:var(--text-dim)">rail</span><div style="width:190px;background:var(--surface2);border-radius:8px;padding:2px"><div class="t" style="animation-timing-function:cubic-bezier(0.34,1.2,0.64,1)"></div></div><span class="val">cubic-bezier(0.34,1.2,0.64,1)</span></div><div style="display:flex;align-items:center;gap:12px"><span style="font-size:10.5px;width:64px;color:var(--text-dim)">panel</span><div style="width:190px;background:var(--surface2);border-radius:8px;padding:2px"><div class="t" style="animation-timing-function:cubic-bezier(0.32,0.72,0,1)"></div></div><span class="val">cubic-bezier(0.32,0.72,0,1)</span></div>
</div></body></html>
