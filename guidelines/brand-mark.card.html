<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<div class="row" style="gap:26px;align-items:center">
  <span style="color:var(--accent);display:flex"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12h11M6.5 12 4 9.3M6.5 12 4 14.7M17.5 12 20 9.3M17.5 12 20 14.7"/><ellipse cx="12" cy="12" rx="5.2" ry="3.1" transform="rotate(-38 12 12)" stroke-width="1.7"/></svg></span>
  <div style="display:flex;align-items:center;gap:10px">
    <span style="color:var(--accent);display:flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12h11M6.5 12 4 9.3M6.5 12 4 14.7M17.5 12 20 9.3M17.5 12 20 14.7"/><ellipse cx="12" cy="12" rx="5.2" ry="3.1" transform="rotate(-38 12 12)" stroke-width="1.7"/></svg></span>
    <span style="font-size:15px;font-weight:700;letter-spacing:-.01em">rigseed</span>
  </div>
  <span class="val" style="max-width:260px;line-height:1.5">Lowercase always. No supplied logo file — this glyph and plain type stand in.</span>
</div></body></html>
