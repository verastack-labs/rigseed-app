<!-- @dsCard group="Colors" viewport="700x150" subtitle="Accent for download, accent2 for upload, warn and danger" name="State colours" -->
<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<div class="row" style="gap:14px">
<div class="col" style="gap:6px"><div style="width:150px;height:38px;border-radius:8px;background:var(--accent)"></div><span style="font-size:10px;color:var(--text-dim)">download · progress · primary</span></div><div class="col" style="gap:6px"><div style="width:150px;height:38px;border-radius:8px;background:var(--accent2)"></div><span style="font-size:10px;color:var(--text-dim)">upload · seeding · connected</span></div><div class="col" style="gap:6px"><div style="width:150px;height:38px;border-radius:8px;background:var(--warn)"></div><span style="font-size:10px;color:var(--text-dim)">search blocked · schedule</span></div><div class="col" style="gap:6px"><div style="width:150px;height:38px;border-radius:8px;background:var(--danger)"></div><span style="font-size:10px;color:var(--text-dim)">remove · errors</span></div>
</div>
<div class="val" style="margin-top:12px">Paused and stalled are never accent-coloured — they use surface2 / text-dimmer.</div></body></html>
