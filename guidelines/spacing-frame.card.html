<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Rail, sidebar and panes are fixed; everything else flexes" name="Fixed frame widths" -->
<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<div class="col" style="gap:7px">
<div style="display:flex;gap:12px;align-items:center"><span style="font-size:11.5px;width:180px;color:var(--text-dim)">rail collapsed</span><span class="val" style="color:var(--text)">60px</span></div><div style="display:flex;gap:12px;align-items:center"><span style="font-size:11.5px;width:180px;color:var(--text-dim)">rail expanded</span><span class="val" style="color:var(--text)">212px</span></div><div style="display:flex;gap:12px;align-items:center"><span style="font-size:11.5px;width:180px;color:var(--text-dim)">sidebar</span><span class="val" style="color:var(--text)">236px</span></div><div style="display:flex;gap:12px;align-items:center"><span style="font-size:11.5px;width:180px;color:var(--text-dim)">settings nav</span><span class="val" style="color:var(--text)">232px</span></div><div style="display:flex;gap:12px;align-items:center"><span style="font-size:11.5px;width:180px;color:var(--text-dim)">list pane</span><span class="val" style="color:var(--text)">440px</span></div><div style="display:flex;gap:12px;align-items:center"><span style="font-size:11.5px;width:180px;color:var(--text-dim)">top bar / toolbar / footer</span><span class="val" style="color:var(--text)">56 / 52 / 34px</span></div>
</div></body></html>
