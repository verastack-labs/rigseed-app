<!-- @dsCard group="Colors" viewport="700x150" subtitle="Seven themes, each with a paired secondary" name="Accents" -->
<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<div class="row">
<div class="col" data-mode="dark" data-accent="dustblue" style="align-items:center;gap:6px">
  <div style="display:flex;gap:3px"><div style="width:38px;height:44px;border-radius:8px 0 0 8px;background:var(--accent)"></div><div style="width:20px;height:44px;border-radius:0 8px 8px 0;background:var(--accent2)"></div></div>
  <span style="font-size:10px;font-weight:600;color:var(--text-dim)">Dusty Blue</span></div><div class="col" data-mode="dark" data-accent="amber" style="align-items:center;gap:6px">
  <div style="display:flex;gap:3px"><div style="width:38px;height:44px;border-radius:8px 0 0 8px;background:var(--accent)"></div><div style="width:20px;height:44px;border-radius:0 8px 8px 0;background:var(--accent2)"></div></div>
  <span style="font-size:10px;font-weight:600;color:var(--text-dim)">Amber</span></div><div class="col" data-mode="dark" data-accent="sage" style="align-items:center;gap:6px">
  <div style="display:flex;gap:3px"><div style="width:38px;height:44px;border-radius:8px 0 0 8px;background:var(--accent)"></div><div style="width:20px;height:44px;border-radius:0 8px 8px 0;background:var(--accent2)"></div></div>
  <span style="font-size:10px;font-weight:600;color:var(--text-dim)">Sage</span></div><div class="col" data-mode="dark" data-accent="terracotta" style="align-items:center;gap:6px">
  <div style="display:flex;gap:3px"><div style="width:38px;height:44px;border-radius:8px 0 0 8px;background:var(--accent)"></div><div style="width:20px;height:44px;border-radius:0 8px 8px 0;background:var(--accent2)"></div></div>
  <span style="font-size:10px;font-weight:600;color:var(--text-dim)">Terracotta</span></div><div class="col" data-mode="dark" data-accent="mustard" style="align-items:center;gap:6px">
  <div style="display:flex;gap:3px"><div style="width:38px;height:44px;border-radius:8px 0 0 8px;background:var(--accent)"></div><div style="width:20px;height:44px;border-radius:0 8px 8px 0;background:var(--accent2)"></div></div>
  <span style="font-size:10px;font-weight:600;color:var(--text-dim)">Mustard</span></div><div class="col" data-mode="dark" data-accent="slateteal" style="align-items:center;gap:6px">
  <div style="display:flex;gap:3px"><div style="width:38px;height:44px;border-radius:8px 0 0 8px;background:var(--accent)"></div><div style="width:20px;height:44px;border-radius:0 8px 8px 0;background:var(--accent2)"></div></div>
  <span style="font-size:10px;font-weight:600;color:var(--text-dim)">Slate Teal</span></div><div class="col" data-mode="dark" data-accent="lavender" style="align-items:center;gap:6px">
  <div style="display:flex;gap:3px"><div style="width:38px;height:44px;border-radius:8px 0 0 8px;background:var(--accent)"></div><div style="width:20px;height:44px;border-radius:0 8px 8px 0;background:var(--accent2)"></div></div>
  <span style="font-size:10px;font-weight:600;color:var(--text-dim)">Lavender</span></div>
</div></body></html>
