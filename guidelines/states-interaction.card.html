<!-- @dsCard group="Motion" viewport="700x150" subtitle="Selected is always accent-soft + accent" name="Interaction states" -->
<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<div class="row" style="gap:10px">
  <div style="padding:9px 14px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:12px;color:var(--text-dim)">rest</div>
  <div style="padding:9px 14px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--line);font-size:12px;color:var(--accent);font-weight:600">hover</div>
  <div style="padding:9px 14px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent);font-size:12px;color:var(--accent);font-weight:600">selected</div>
  <div style="padding:9px 14px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:12px;color:var(--text-dim);opacity:.45">disabled</div>
  <div style="padding:9px 14px;border-radius:8px;background:var(--accent);color:var(--accent-on);font-size:12px;font-weight:700;outline:2px solid var(--accent);outline-offset:2px">focus</div>
</div></body></html>
