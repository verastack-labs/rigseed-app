<!doctype html>
<html data-mode="dark" data-accent="dustblue">
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-ui);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:4px}
.sw{width:56px;height:44px;border-radius:8px;border:1px solid var(--line)}
.lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dimmer)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
</style></head><body>
<div class="row">
<div class="col"><div class="sw" style="background:var(--bg)"></div><span class="lbl">bg</span></div><div class="col"><div class="sw" style="background:var(--sidebar-bg)"></div><span class="lbl">sidebar</span></div><div class="col"><div class="sw" style="background:var(--surface)"></div><span class="lbl">surface</span></div><div class="col"><div class="sw" style="background:var(--surface2)"></div><span class="lbl">surface2</span></div><div class="col"><div class="sw" style="background:var(--line)"></div><span class="lbl">line</span></div><div class="col"><div class="sw" style="background:var(--accent-soft)"></div><span class="lbl">accent-soft</span></div>
</div></body></html>
