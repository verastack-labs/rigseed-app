<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rigseed">
  <!--
    GENERATED by scripts/build-icon.mjs. Edit rigseed-mark.template.svg.

    The app icon: a seedling in ground, sky behind it.

    This is the source of truth for both icons the app has. `scripts/build-icon.mjs`
    substitutes the two SKY tokens with the default accent and writes
    rigseed-mark.svg, which `tauri icon` turns into the packaged set. And
    src/icon.rs substitutes the same two tokens at runtime with whichever accent
    the user picked, rasterises it, and hands it to the window. One drawing,
    so the taskbar icon and the installed icon cannot drift apart.

    Only the sky is themed. The soil stays earth-coloured and the plant stays
    pale in every accent: those are what make it recognisable, and recolouring
    everything would leave eight icons with nothing in common but their shape.

    Authored at 1024 rather than scaled up from a 24-unit glyph. The soil arc
    and the leaves are shapes rather than strokes, so there is no line weight
    to get wrong at size, which is what went wrong with the mark this replaced.
  -->
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="84" y1="84" x2="384" y2="940">
      <stop offset="0" stop-color="#5A8AAA" />
      <stop offset="1" stop-color="#2B5069" />
    </linearGradient>

    <!-- A light top edge, the way a physical object catches the sky. -->
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="512" y1="84" x2="512" y2="560">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- The ground would otherwise spill past the rounded corners. -->
    <clipPath id="tile">
      <rect x="84" y="84" width="856" height="856" rx="196" />
    </clipPath>
  </defs>

  <!--
    Inset rather than full bleed. macOS draws its own squircle and expects the
    art to leave room; Windows crops nothing.
  -->
  <rect x="84" y="84" width="856" height="856" rx="196" fill="url(#sky)" />

  <!-- The ground: a shallow dome sitting low, so the field above reads as sky. -->
  <path d="M84 940 H940 V807 A428 223 0 0 0 84 807 Z" fill="#8E5A42" clip-path="url(#tile)" />

  <!-- Stem, then the two leaves. The larger one leads. -->
  <path
    d="M512 790V444"
    fill="none"
    stroke="#EAF3E8"
    stroke-width="90"
    stroke-linecap="round"
  />
  <path
    d="M512 521c0-107 86-193 193-193 0 107-86 193-193 193Z"
    fill="#EAF3E8"
  />
  <path
    d="M512 636c0-86-64-150-150-150 0 86 64 150 150 150Z"
    fill="#EAF3E8"
    fill-opacity="0.62"
  />

  <rect x="84" y="84" width="856" height="856" rx="196" fill="url(#rim)" />
</svg>
